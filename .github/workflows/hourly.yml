# Hourly rain archive for the 4 Corners Precip Map.
# Ambient keeps 5-minute readings for only about 8 days, so this saves each day's
# hourly rain for every station into history/hourly/ before it ages out.
# Runs every night after the daily archive. Run by hand with 8 in "days" to save
# everything still available.
name: Ambient hourly

on:
  schedule:
    - cron: '13 9 * * *'   # 3:13 AM MDT / 2:13 AM MST, after the daily archive
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to save, ending yesterday (1 to 8)'
        required: true
        default: '1'

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Save hourly rain
        run: node .github/scripts/hourly.mjs
        env:
          DAYS: ${{ github.event.inputs.days || '1' }}
      - name: Save to the repo
        run: |
          git config user.name "4CPM history"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Hourly rain through $(TZ=America/Denver date -d yesterday +%F)"
          git pull --rebase
          git push
