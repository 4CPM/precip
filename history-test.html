<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>4 Corners Precip Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/d3-array@3.2.4/dist/d3-array.min.js"></script>
<script src="https://unpkg.com/d3-contour@4.0.2/dist/d3-contour.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8fafc;color:#1e293b}
#map{width:100%;height:100vh}

/* ── Pins ─────────────────────────────────────────────── */
.pin{
  display:flex;align-items:center;justify-content:center;
  border-radius:11px;font-weight:700;font-size:11px;
  font-variant-numeric:tabular-nums;
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 2px 6px rgba(0,0,0,.4);
  cursor:pointer;height:22px;min-width:38px;padding:0 5px;
}
.pin.suspect{border:2px dashed #475569;background:#e2e8f0 !important;color:#475569 !important}
.pin.official{border-color:#111827;border-width:2.5px}
.pin.dot{min-width:0;width:12px;height:12px;padding:0;border-radius:50%;font-size:0;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pin.dot.official{width:14px;height:14px;border-radius:2px}
.pin.snotel{border-radius:4px;border:2.5px solid #0c4a6e}
.pin.dot.snotel{width:13px;height:13px;border-radius:2px;transform:rotate(45deg)}
.pin.dot.suspect{border-width:1.5px}

/* ── Popup ─────────────────────────────────────────────── */
.st-popup{min-width:220px;font-size:12px;color:#334155}
.st-popup h3{margin:0 0 2px;font-size:14px;color:#1e293b}
.st-popup .sub{color:#64748b;margin-bottom:8px}
.st-popup .big{font-size:22px;font-weight:700;color:#1e293b;font-variant-numeric:tabular-nums}
.st-popup .big small{font-size:12px;font-weight:600;color:#64748b}
.st-popup .row{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px solid #f1f5f9}
.st-popup .row:last-child{border-bottom:none}
.st-popup .row span:last-child{font-weight:600;color:#1e293b;text-align:right}
.st-popup .vals{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:6px 0 8px}
.st-popup .vals div{background:#f1f5f9;border-radius:6px;padding:3px 2px;text-align:center}
.st-popup .vals div.on{background:#dbeafe}
.st-popup .vals b{display:block;font-size:12px;color:#1e293b;font-variant-numeric:tabular-nums}
.st-popup .vals span{font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
.st-popup .warn{margin:6px 0;padding:5px 8px;border-radius:6px;background:#fef3c7;color:#92400e;font-size:11px;line-height:1.4}
.st-popup a{color:#2563eb;text-decoration:none;font-weight:600}
.st-popup a:hover{text-decoration:underline}

/* ── Info panel ────────────────────────────────────────── */
.info-panel{
  background:rgba(255,255,255,.94);color:#1e293b;
  padding:14px 18px;border-radius:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  width:250px;font-size:13px;line-height:1.5;
  backdrop-filter:blur(8px);
}
.info-panel h2{font-size:15px;color:#1e293b;margin-bottom:2px}
.info-panel .asof{font-size:11px;color:#64748b;margin-bottom:8px}
.info-panel .stat{display:flex;justify-content:space-between;padding:2px 0;gap:16px}
.info-panel .stat .val{font-weight:600;color:#2563eb;white-space:nowrap;font-variant-numeric:tabular-nums}
.panel-btn{
  display:block;width:100%;margin-top:10px;padding:6px 0;
  border:1px solid rgba(37,99,235,.35);border-radius:6px;
  background:#eff6ff;color:#2563eb;font-size:12px;font-weight:600;
  cursor:pointer;text-align:center;font-family:inherit;
}
.panel-btn:hover{background:#dbeafe}
.panel-btn:disabled{opacity:.6;cursor:wait}
.refresh-msg{font-size:11px;color:#64748b;margin-top:6px;line-height:1.4}
.refresh-msg.err{color:#b91c1c}

/* ── Filter bar ─────────────────────────────────────────── */
.filter-bar{
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.95);padding:6px 9px 8px;border-radius:9px;
  box-shadow:0 3px 14px rgba(0,0,0,.15);backdrop-filter:blur(8px);
}
.opt-grid{display:grid;grid-template-columns:auto auto;gap:5px 8px;align-items:center}
.opt-l{font-size:11px;font-weight:600;color:#64748b;text-align:right;white-space:nowrap}
.opt-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg-ctrl.wrap{flex-wrap:wrap;max-width:420px}
.info-btn{width:17px;height:17px;border-radius:50%;border:1.5px solid #94a3b8;background:#fff;color:#64748b;font:italic 700 11px Georgia,serif;line-height:1;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.info-btn:hover,.info-btn.active{border-color:#0891b2;color:#0891b2;background:#ecfeff}
.info-btn:focus-visible{outline:2px solid #0891b2;outline-offset:1px}
.hist-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.hist-row label{display:flex;align-items:center;gap:4px;font-weight:600;color:#475569}
.hist-row input[type=date]{font:inherit;font-size:12px;padding:2px 4px;border:1px solid rgba(0,0,0,.2);border-radius:5px;background:#fff;color:#1e293b}
.hist-days{margin:4px 0 6px;max-height:160px;overflow-y:auto;border-top:1px solid #f1f5f9}
.hist-gap{font-size:11px;color:#92400e;margin:3px 0}
.info-btn.gear{font:400 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-style:normal}
.con-grid{display:grid;grid-template-columns:auto auto;gap:5px 8px;align-items:center;justify-content:start}
.con-desc{margin-top:7px;padding-top:6px;border-top:1px solid rgba(0,0,0,.08)}
.con-label{display:inline-block;font-size:10px;font-weight:700;color:#0f172a;background:rgba(255,255,255,.85);border-radius:6px;padding:0 3px;font-variant-numeric:tabular-nums;white-space:nowrap;transform:translateY(0)}
.info-pop{grid-column:1 / -1;font-size:11px;line-height:1.45;color:#475569;background:#f1f5f9;border-radius:6px;padding:7px 9px;max-width:400px}
.filter-row{display:flex;gap:6px;align-items:center}
.filter-row+.filter-row{margin-top:6px;padding-top:6px;border-top:1px solid rgba(0,0,0,.07);justify-content:center;gap:12px}
.filter-btn{
  padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;
  cursor:pointer;border:none;background:rgba(0,0,0,.06);color:#64748b;font-family:inherit;
}
.filter-btn:hover{background:rgba(0,0,0,.1)}
.filter-btn.active{color:#fff;background:#0e7490}
.toggle-btn{display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:none;background:transparent;padding:1px 2px;border-radius:5px;font-family:inherit}
.toggle-btn:hover{background:rgba(0,0,0,.06)}
.toggle-track{display:inline-block;width:26px;height:14px;border-radius:7px;background:rgba(0,0,0,.18);position:relative;transition:background .2s;flex-shrink:0}
.toggle-thumb{position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.toggle-btn.active .toggle-track{background:#0891b2}
.toggle-btn.active .toggle-thumb{left:14px}
.toggle-label-text{font-size:11px;font-weight:600;color:#64748b}
.toggle-btn.active .toggle-label-text{color:#0891b2}
.seg-ctrl{display:inline-flex;border-radius:5px;overflow:hidden;border:1px solid rgba(0,0,0,.15);justify-self:start}
.seg-btn{padding:2px 6px;border:none;background:#fff;font-family:inherit;font-size:11px;font-weight:600;color:#64748b;cursor:pointer;white-space:nowrap}
.seg-btn:not(:last-child){border-right:1px solid rgba(0,0,0,.12)}
.seg-btn:hover:not(.active){background:rgba(0,0,0,.04)}
.seg-btn.active{background:#0891b2;color:#fff}

/* ── Legend ────────────────────────────────────────────── */
.legend{
  background:rgba(255,255,255,.94);color:#1e293b;
  padding:12px 14px;border-radius:8px;
  box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:12px;backdrop-filter:blur(8px);
}
.legend h4{margin:0 0 6px;font-size:13px}
.legend-row{display:flex;align-items:center;gap:8px;padding:1px 0;font-variant-numeric:tabular-nums}
.legend-sw{width:28px;height:13px;border-radius:7px;border:1px solid rgba(0,0,0,.12);flex-shrink:0}
.legend-sw.suspect{background:#e2e8f0;border:1.5px dashed #475569}
.legend-sw.official{background:#fff;border:2.5px solid #111827}
.legend-sw.snotel{background:#fff;border:2.5px solid #0c4a6e;border-radius:3px}
.leg-fit{margin:5px 0 2px;color:#64748b;font-size:11px;max-width:220px;line-height:1.4}
.leg-adj-btn{border:none;background:none;padding:0;margin-left:2px;color:#0e7490;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.leg-adj-btn:hover{text-decoration:underline}
.leg-adj{display:grid;grid-template-columns:auto auto;gap:5px 7px;align-items:center;margin:4px 0 2px;padding:7px 0 3px;border-top:1px solid rgba(0,0,0,.08)}
.leg-adj[hidden]{display:none}
.leg-adj .seg-btn:disabled{opacity:.4;cursor:default}
.legend .note{margin-top:6px;padding-top:6px;border-top:1px solid rgba(0,0,0,.08);color:#64748b;font-size:11px;max-width:200px;line-height:1.4}

/* ── Search ─────────────────────────────────────────────── */
.search-bar{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  z-index:1000;display:flex;align-items:center;
  background:rgba(255,255,255,.96);border-radius:10px;
  box-shadow:0 4px 24px rgba(0,0,0,.2);
}
.search-bar input{border:none;outline:none;background:transparent;font-size:14px;color:#1e293b;padding:10px 14px;width:260px;font-family:inherit}
.search-bar input::placeholder{color:#94a3b8}
.search-clear{background:none;border:none;cursor:pointer;padding:0 12px;color:#94a3b8;font-size:16px;line-height:1;display:none}
.search-clear:hover{color:#475569}
.search-results{
  position:absolute;top:calc(100% + 4px);left:0;right:0;
  background:rgba(255,255,255,.98);border-radius:8px;
  box-shadow:0 4px 16px rgba(0,0,0,.15);max-height:240px;overflow-y:auto;display:none;
}
.search-result-item{padding:7px 12px;font-size:12px;color:#1e293b;cursor:pointer;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;gap:10px}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover,.search-result-item.selected{background:#eff6ff;color:#2563eb}
.search-result-item .count{color:#94a3b8;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── Draw control ───────────────────────────────────────── */
.draw-control{background:rgba(255,255,255,.94);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);display:flex;gap:4px;padding:8px 10px}
.draw-btn{padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:rgba(0,0,0,.06);color:#64748b;font-family:inherit}
.draw-btn:hover{background:rgba(0,0,0,.1);color:#334155}
.draw-btn.active{background:#f59e0b;color:#fff}
.draw-btn.poly.active{background:#8b5cf6;color:#fff}
.draw-clear{padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:rgba(239,68,68,.12);color:#ef4444;display:none;font-family:inherit}
.draw-clear:hover{background:rgba(239,68,68,.22)}
.draw-sep{width:1px;background:rgba(0,0,0,.12);margin:0 2px;align-self:stretch}
.draw-active{cursor:crosshair !important}
.draw-active .leaflet-interactive{pointer-events:none}

/* ── Selection stats panel ──────────────────────────────── */
#sel-panel{
  position:absolute;bottom:28px;left:12px;z-index:1000;
  background:rgba(255,255,255,.95);color:#1e293b;
  padding:12px 14px;border-radius:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  width:300px;max-width:calc(100vw - 24px);font-size:12px;display:none;
}
.sel-header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;color:#475569;margin-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.sel-close{border:none;background:rgba(239,68,68,.12);color:#ef4444;font:inherit;font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;padding:4px 10px;border-radius:6px;cursor:pointer;flex-shrink:0}
.sel-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.sel-stats div{background:#f1f5f9;border-radius:6px;padding:4px 6px;text-align:center}
.sel-stats b{display:block;font-size:14px;color:#1e293b;font-variant-numeric:tabular-nums}
.sel-stats span{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
.sel-list{max-height:180px;overflow-y:auto;border-top:1px solid #e2e8f0}
.sel-list .r{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid #f1f5f9;cursor:pointer}
.sel-list .r:hover{color:#2563eb}
.sel-list .r b{font-variant-numeric:tabular-nums}
.sel-list .r.sus{color:#94a3b8}
.sel-copy{margin-top:8px;width:100%;padding:5px 0;border:1px solid rgba(37,99,235,.35);border-radius:6px;background:#eff6ff;color:#2563eb;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit}
.sel-copy:hover{background:#dbeafe}

/* ── Radius label ───────────────────────────────────────── */
.ring-label{font-size:11px;font-weight:700;color:#dc2626;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:8px;white-space:nowrap;border:1px solid rgba(220,38,38,.3)}

/* ── App name and version ───────────────────────────────── */
.app-name{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#94a3b8;margin-bottom:3px;white-space:nowrap}
.app-name span{font-weight:500;letter-spacing:0;text-transform:none}

/* ── Collapsible panels ─────────────────────────────────── */
.panel-head{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;padding:0;cursor:pointer;font-family:inherit;color:inherit;text-align:left}
.panel-head h2,.panel-head h4{margin:0;flex:1;white-space:nowrap}
.panel-head .summary{font-size:12px;font-weight:600;color:#2563eb;white-space:nowrap;font-variant-numeric:tabular-nums}
.panel-head .chev{font-size:12px;color:#64748b;transition:transform .2s}
.collapsed .panel-head .chev{transform:rotate(-90deg)}
.collapsed .panel-body{display:none}
.panel-body{margin-top:8px}
.info-panel:not(.collapsed) .panel-head .summary{display:none}
.filter-bar .panel-head{padding:1px 1px 0}
.filter-bar .panel-head h4{font-size:12px;color:#1e293b}
.filter-bar.collapsed{padding:6px 10px}
.legend.collapsed{padding:8px 12px}

/* ── Draw hint ──────────────────────────────────────────── */
#draw-hint{
  position:absolute;left:50%;transform:translateX(-50%);top:62px;z-index:1001;
  display:none;align-items:center;gap:10px;
  background:#1e293b;color:#fff;font-size:13px;font-weight:600;
  padding:8px 8px 8px 14px;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.3);white-space:nowrap;
}
#draw-hint button{border:none;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-size:12px;padding:5px 10px;border-radius:14px;cursor:pointer}

#zoom-hint{
  position:absolute;left:50%;transform:translateX(-50%);bottom:34px;z-index:1000;display:none;
  background:#1e293b;color:#fff;font-size:12px;font-weight:600;line-height:1.35;text-align:center;
  padding:8px 14px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:min(420px,calc(100vw - 40px));
}

/* ── Credit line ────────────────────────────────────────── */
.leaflet-control-attribution{white-space:normal;max-width:calc(100vw - 20px);line-height:1.35;font-size:11px;text-align:right}
.leaflet-control-attribution .cr{white-space:nowrap}

/* ── Phones ─────────────────────────────────────────────── */
@media (max-width:700px){
  .leaflet-control-zoom{display:none}
  .search-bar{left:10px;right:10px;transform:none;top:calc(10px + env(safe-area-inset-top,0px))}
  .search-bar input{width:auto;flex:1;min-width:0;font-size:16px;padding:11px 14px}
  .search-clear{font-size:20px;padding:0 14px}
  .search-result-item{padding:11px 14px;font-size:14px}
  .leaflet-top{top:calc(58px + env(safe-area-inset-top,0px))}
  .leaflet-top .leaflet-control{margin-top:6px}
  .leaflet-left .leaflet-control{margin-left:10px}
  .leaflet-right .leaflet-control{margin-right:10px}
  .info-panel{width:auto;max-width:calc(100vw - 150px);padding:9px 12px;font-size:13px}
  .info-panel h2{font-size:14px}
  .info-panel:not(.collapsed){max-width:calc(100vw - 20px);width:calc(100vw - 20px)}
  .filter-bar{max-width:calc(100vw - 20px)}
  .filter-bar:not(.collapsed){width:auto}
  .seg-ctrl.wrap{max-width:none}
  .opt-grid{grid-template-columns:auto minmax(0,1fr)}
  .seg-ctrl{flex-wrap:wrap}
  .seg-btn{padding:6px 7px}
  .info-btn{width:22px;height:22px;font-size:13px}
  .info-pop{font-size:12px;max-width:none}
  .draw-btn,.draw-clear{padding:6px 10px;font-size:12px}
  .seg-btn{padding:6px 8px;font-size:12px}
  .opt-l,.toggle-label-text{font-size:12px}
  .opt-grid{gap:7px 8px}
  .panel-btn{padding:10px 0;font-size:14px}
  .legend{font-size:12px;padding:9px 12px}
  .legend .note{max-width:none}
  .leg-fit{max-width:none}
  .leaflet-bottom .leaflet-control{margin-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  #sel-panel{left:8px;right:8px;width:auto;max-width:none;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:42vh;overflow-y:auto;font-size:14px}
  .sel-list{max-height:none}
  .sel-list .r{padding:8px 0}
  .sel-copy{padding:10px 0;font-size:14px}
  #draw-hint{top:calc(62px + env(safe-area-inset-top,0px))}
  #zoom-hint{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  .leaflet-control-attribution{font-size:9.5px;max-width:calc(100vw - 70px)}
  .leaflet-control-attribution .cr-d{white-space:normal}
  .leaflet-popup-content{margin:12px 14px}
}
</style>
</head>
<body>
<div id="map"></div>

<script>
// ── Data ────────────────────────────────────────────────────────────────────
// Ambient Weather Network and official gauges (NWS ASOS, RAWS and other remote
// gauges, NOAA USCRN via the Iowa Environmental Mesonet) load live each time
// the page opens and on Refresh.
// Version shown on the map. Bump it with every published change.
const APP_VERSION = '1.40 history test';
const CENTER = { name: 'Four Corners', lat: 36.99898, lon: -109.04517 };
const DATA_CENTER = { lat: CENTER.lat, lon: CENTER.lon };   // Four Corners Monument, 36°59′56″N 109°02′43″W
const MAX_RADIUS = 500;    // miles; nothing beyond this is loaded or shown
// Ambient stations load by map area as people pan and zoom, in cells of
// 1° latitude by 1.2° longitude (about 70 by 66 miles).
const CELL_LAT = 1.0, CELL_LON = 1.2;
const MAX_CELLS = 120;          // past this many cells on screen, ask the viewer to zoom in
const CELL_TTL = 15 * 60e3;     // reload a cell's stations when they are older than 15 minutes

// ── What to show, and its color classes ─────────────────────────────────────
// Ambient stations report the seven rain values. NWS, RAWS and USCRN gauges report
// only the past hour (used for Rate) and the day's total. SNOTEL sites give Day,
// Week, Month and Year from their running precipitation total.
// (Snow water equivalent and snow depth are planned for v2.)
// "check" says whether the likely-erroneous test applies; Year depends
// on when each gauge was installed or reset, so neighbors can't be compared fairly.
// "scale" sizes that test's inch thresholds to the value being shown.
const METRICS = {
  rate:  { label: 'Rate',  title: 'Rain in the past hour (in/hr)',     unit: 'in/hr', amb: 'hourlyrainin',  off: 'phour', breaks: [0.01, 0.05, 0.10, 0.20, 0.30, 0.50, 0.75, 1.00], scale: 0.25, check: true },
  day:   { label: 'Day',   title: 'Rain since midnight (in)',          unit: 'in',    amb: 'dailyrainin',   off: 'pday',  breaks: [0.01, 0.25, 0.50, 0.75, 1.00, 1.25, 1.50, 2.00, 2.50, 3.00, 3.50, 4.00], scale: 1,    check: true },

//     the comparison has to reach out to 10 miles), or

    }

    ${links.length ? `<div style="margin-top:6px;display:flex;flex-direction:column;gap:2px">${links.join('')}</div>` : ''}`;
  el.querySelector('h3').textContent = s.name;
  el.querySelector('.sub').textContent = [netLabel, s.area].filter(Boolean).join(' · ');
  return el;
}

function updateStats() {
  const vis = stations.filter(s => visible(s));
  const good = vis.filter(s => !s.suspect).map(s => s.p);
  const inRadius = stations.filter(s => s.dist <= radius);
  document.getElementById('asof').textContent = `${dataTime} · within ${radius} mi of ${CENTER.name}`;
  document.getElementById('st-n').textContent = vis.length;
  const U = METRICS[metric].unit;
  document.getElementById('info-title').textContent = metric === 'day' ? 'Rain Today' : metric === 'hist' && hist ? `Rain: ${hist.label}` : `Rain: ${METRICS[metric].label}`;
  document.getElementById('st-med').textContent = good.length ? `${fmtV(median(good))} ${U}` : '—';
  document.getElementById('st-rng').textContent = good.length ? `${fmtV(Math.min(...good))} – ${fmtV(Math.max(...good))} ${U}` : '—';
  document.getElementById('st-sus').textContent = `${inRadius.filter(s => s.suspect).length}${suspectFilter === 'exclude' ? ' (hidden)' : ''}`;
  document.getElementById('st-summary').textContent = good.length ? `${fmtV(median(good))} ${U} median · ${vis.length}` : (stations.length ? 'No gauges' : 'Loading…');
}

// ── Legend ───────────────────────────────────────────────────────────────────
function legendHtml() {
  const M = METRICS[metric];
  const offNote = metric === 'hist' ? '<div class="note">History shows personal (Ambient) stations only for now. Each day is the station\'s end-of-day daily total.</div>'
    : metric === 'event' ? '<div class="note">Official gauges and SNOTEL sites don\'t report this value, so only personal stations show.</div>'
    : metric === 'rate' ? '<div class="note">SNOTEL sites don\'t report Rate.</div>'
    : metric === 'year' ? '<div class="note">SNOTEL Year is January 1 to now, worked out from the water-year total.</div>' : '';
  const chk = M.check ? ''
    : '<div class="note">Year depends on when each gauge was installed or reset, so it isn\'t checked against nearby gauges. Year readings over 80 in are flagged as impossible here.</div>';
  return `<button class="panel-head" type="button"><h4>${M.title}</h4><span class="chev">▾</span></button><div class="panel-body">` +
    CLASSES.map(c => `<div class="legend-row"><div class="legend-sw" style="background:${c.bg}"></div>${c.label}</div>`).join('') +
    legendAdjHtml() +
    `<div class="legend-row" style="margin-top:4px"><div class="legend-sw suspect"></div>Likely erroneous</div>
     <div class="legend-row"><div class="legend-sw official"></div>NWS etc</div>
     <div class="legend-row"><div class="legend-sw snotel"></div>SNOTEL</div>${offNote}${chk}${contourMode === 'off' ? '' : `<div class="note">Contours (${CON_NAMES[conMethod]}) are estimated between gauges, not measured, ${EDGE_DESC[conEdge]}; likely-erroneous readings are left out. <span id="con-note">${conNote}</span></div>`}</div>`;
}
function legendAdjHtml() {
  const seg = (attr, cur, opts, off) => `<div class="seg-ctrl">${opts.map(([v, t, tip]) =>
    `<button class="seg-btn${String(v) === String(cur) ? ' active' : ''}" type="button" data-${attr}="${v}"${tip ? ` title="${tip}"` : ''}${off ? ' disabled' : ''}>${t}</button>`).join('')}</div>`;
  const fixed = legendRange === 'fixed';
  return `<div class="leg-fit"><span id="leg-info">${scaleInfo || 'Fixed brackets, the same every time.'}</span>
      <button class="leg-adj-btn" id="leg-adj" type="button" aria-expanded="${legendAdjOpen}">Adjust ${legendAdjOpen ? '▴' : '▾'}</button></div>
    <div class="leg-adj"${legendAdjOpen ? '' : ' hidden'}>
      <span class="opt-l">Brackets</span>${seg('lr', legendRange, [['loaded', 'All loaded', 'Fit to every gauge loaded within the radius'], ['screen', 'On screen', 'Fit to the gauges on screen; changes as you pan and zoom'], ['fixed', 'Fixed', 'The set brackets, the same every time']])}
      <span class="opt-l">Steps</span>${seg('lm', legendMethod, [['equal', 'Equal', 'Equal steps with round edges'], ['count', 'Equal counts', 'Each color holds about the same number of gauges']], fixed)}
      <span class="opt-l">Number</span>${seg('ln', legendSteps, [[4, '4'], [6, '6'], [8, '8'], [10, '10'], [12, '12']], fixed)}
    </div>`;
}
let legendEl;
function addLegend() {
  const c = L.control({ position: 'bottomright' });
  c.onAdd = () => {
    legendEl = L.DomUtil.create('div', 'legend');
    legendEl.innerHTML = legendHtml();
    L.DomEvent.disableClickPropagation(legendEl);
    L.DomEvent.disableScrollPropagation(legendEl);
    makeCollapsible(legendEl, IS_PHONE);
    legendEl.addEventListener('click', e => {
      const t = e.target.closest('button');
      if (!t || t.disabled) return;
      if (t.id === 'leg-adj') legendAdjOpen = !legendAdjOpen;
      else if (t.dataset.lr) legendRange = t.dataset.lr;
      else if (t.dataset.lm) legendMethod = t.dataset.lm;
      else if (t.dataset.ln) legendSteps = +t.dataset.ln;
      else return;
      legendSig = '';
      if (t.id === 'leg-adj') updateScale(); else render();
    });
    return legendEl;
  };
  c.addTo(leafletMap);
}
function updateLegend() {
  const collapsed = legendEl.classList.contains('collapsed');
  legendEl.innerHTML = legendHtml();
  legendEl.classList.remove('collapsed');
  makeCollapsible(legendEl, collapsed);
}

// ── Draw box / polygon ───────────────────────────────────────────────────────
function addDrawControl() {
  document.getElementById('draw-btn').addEventListener('click', toggleDrawMode);
  document.getElementById('draw-clear').addEventListener('click', clearBBox);
  document.getElementById('poly-draw-btn').addEventListener('click', togglePolyMode);
  document.getElementById('poly-clear').addEventListener('click', clearPoly);

  const container = leafletMap.getContainer();
  const panel = document.createElement('div');
  panel.id = 'sel-panel';
  container.appendChild(panel);
  L.DomEvent.disableClickPropagation(panel);
  L.DomEvent.disableScrollPropagation(panel);

  const hint = document.createElement('div');
  hint.id = 'draw-hint';
  hint.innerHTML = '<span id="draw-hint-text"></span><button type="button" id="draw-cancel">Cancel</button>';
  container.appendChild(hint);
  L.DomEvent.disableClickPropagation(hint);
  hint.querySelector('#draw-cancel').addEventListener('click', () => { if (drawMode) toggleDrawMode(); if (polyMode) togglePolyMode(); });

  // Pointer events cover mouse, finger and pen alike.
  const inUi = e => e.target.closest('.leaflet-control, .search-bar, #sel-panel, #draw-hint');
  const ll = e => leafletMap.mouseEventToLatLng(e);
  let active = false;
  container.addEventListener('pointerdown', e => {
    if (!(drawMode || polyMode) || inUi(e) || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault(); e.stopPropagation();
    active = true;
    try { container.setPointerCapture(e.pointerId); } catch (_) {}
    if (drawMode) onBoxDown({ latlng: ll(e) }); else onPolyDown({ latlng: ll(e) });
  }, true);
  container.addEventListener('pointermove', e => {
    if (!active) return;
    e.preventDefault();
    if (drawMode) onBoxMove({ latlng: ll(e) }); else if (polyMode) onPolyMove({ latlng: ll(e) });
  }, true);
  const end = e => {
    if (!active) return;
    active = false;
    if (drawMode) onBoxUp({ latlng: ll(e) }); else if (polyMode) onPolyUp();
  };
  container.addEventListener('pointerup', end, true);
  container.addEventListener('pointercancel', end, true);
}

function setMapInteraction(on, hintText) {
  const fn = on ? 'enable' : 'disable';
  leafletMap.dragging[fn](); leafletMap.doubleClickZoom[fn](); leafletMap.scrollWheelZoom[fn](); leafletMap.touchZoom[fn]();
  const c = leafletMap.getContainer();
  c.classList.toggle('draw-active', !on);
  c.style.touchAction = on ? '' : 'none';
  const hint = document.getElementById('draw-hint');
  if (!on) {
    document.getElementById('draw-hint-text').textContent = hintText;
    hint.style.display = 'flex';
    leafletMap.closePopup();
    if (IS_PHONE) document.getElementById('options-panel').classList.add('collapsed');
  } else hint.style.display = 'none';
}

function toggleDrawMode() {
  if (polyMode) togglePolyMode();
  drawMode = !drawMode;
  const btn = document.getElementById('draw-btn');
  btn.classList.toggle('active', drawMode);
  btn.textContent = '⬚ Box';
  setMapInteraction(!drawMode, IS_PHONE ? 'Drag a finger to draw a box' : 'Drag on the map to draw a box');
  if (!drawMode) { if (drawRect && !activeBBox) { leafletMap.removeLayer(drawRect); drawRect = null; } drawStart = null; }
}
function onBoxDown(e) { if (!drawMode) return; drawStart = e.latlng; if (drawRect) { leafletMap.removeLayer(drawRect); drawRect = null; } }
function onBoxMove(e) {
  if (!drawMode || !drawStart) return;
  const b = L.latLngBounds(drawStart, e.latlng);
  if (drawRect) drawRect.setBounds(b);
  else drawRect = L.rectangle(b, { color: '#f59e0b', weight: 2, fillColor: '#f59e0b', fillOpacity: .08, dashArray: '6 4', interactive: false }).addTo(leafletMap);
}
function onBoxUp(e) {
  if (!drawMode || !drawStart) return;
  const b = L.latLngBounds(drawStart, e.latlng), sw = b.getSouthWest(), ne = b.getNorthEast();
  drawStart = null;
  if (Math.abs(ne.lat - sw.lat) < 0.005 && Math.abs(ne.lng - sw.lng) < 0.005) { if (drawRect) { leafletMap.removeLayer(drawRect); drawRect = null; } return; }
  activeBBox = { minLat: sw.lat, maxLat: ne.lat, minLon: sw.lng, maxLon: ne.lng };
  leafletMap.fitBounds(b, { paddingTopLeft: [20, IS_PHONE ? 120 : 20], paddingBottomRight: [20, IS_PHONE ? window.innerHeight * 0.45 : 20] });
  if (activePoly) clearPoly(true);
  toggleDrawMode();
  document.getElementById('draw-clear').style.display = 'inline';
  render();
}
function clearBBox(silent) {
  activeBBox = null;
  if (drawRect) { leafletMap.removeLayer(drawRect); drawRect = null; }
  document.getElementById('draw-clear').style.display = 'none';
  document.getElementById('sel-panel').style.display = 'none';
  if (silent !== true) render();
}

function pointInPolygon(lat, lon, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ai, oi] = poly[i], [aj, oj] = poly[j];
    if ((ai > lat) !== (aj > lat) && lon < (oj - oi) * (lat - ai) / (aj - ai) + oi) inside = !inside;
  }
  return inside;
}
function togglePolyMode() {
  if (drawMode) toggleDrawMode();
  polyMode = !polyMode;

  btn.classList.toggle('active', polyMode);
  btn.textContent = '⬟ Polygon';
  setMapInteraction(!polyMode, IS_PHONE ? 'Trace the area with a finger' : 'Hold the button and trace the area');
  polyDrawing = false; polyVertices = [];
  if (polyPreviewLayer) { leafletMap.removeLayer(polyPreviewLayer); polyPreviewLayer = null; }
}
function onPolyDown(e) {
  if (!polyMode) return;
  polyDrawing = true; polyVertices = [[e.latlng.lat, e.latlng.lng]];
  if (polyPreviewLayer) { leafletMap.removeLayer(polyPreviewLayer); polyPreviewLayer = null; }
}
function onPolyMove(e) {
  if (!polyMode || !polyDrawing) return;
  const last = leafletMap.latLngToContainerPoint(polyVertices[polyVertices.length - 1]);
  const cur = leafletMap.latLngToContainerPoint(e.latlng);
  if ((cur.x - last.x) ** 2 + (cur.y - last.y) ** 2 < 25) return;
  polyVertices.push([e.latlng.lat, e.latlng.lng]);
  const pts = [...polyVertices, polyVertices[0]];
  if (polyPreviewLayer) polyPreviewLayer.setLatLngs(pts);

}
function onPolyUp() {
  if (!polyMode || !polyDrawing) return;
  polyDrawing = false;
  if (polyVertices.length < 3) { if (polyPreviewLayer) { leafletMap.removeLayer(polyPreviewLayer); polyPreviewLayer = null; } polyVertices = []; return; }
  const verts = [...polyVertices];
  togglePolyMode();
  if (polyLayer) leafletMap.removeLayer(polyLayer);
  if (activeBBox) clearBBox(true);
  activePoly = verts;
  polyLayer = L.polygon(activePoly, { color: '#8b5cf6', weight: 2, fillColor: '#8b5cf6', fillOpacity: .08, dashArray: '6 4', interactive: false }).addTo(leafletMap);
  document.getElementById('poly-clear').style.display = 'inline';
  render();
}
function clearPoly(silent) {

  if (polyLayer) { leafletMap.removeLayer(polyLayer); polyLayer = null; }
  if (polyPreviewLayer) { leafletMap.removeLayer(polyPreviewLayer); polyPreviewLayer = null; }
  document.getElementById('poly-clear').style.display = 'none';
  document.getElementById('sel-panel').style.display = 'none';
  if (silent !== true) render();
}

function addSearchBar() {
  const container = leafletMap.getContainer();
  const bar = document.createElement('div'); bar.className = 'search-bar';
  const results = document.createElement('div'); results.className = 'search-results';
  const input = document.createElement('input');
  input.type = 'text'; input.id = 'station-search'; input.placeholder = 'Search station or town…'; input.autocomplete = 'off';
  const clearBtn = document.createElement('button'); clearBtn.className = 'search-clear'; clearBtn.textContent = '×'; clearBtn.title = 'Clear search';
  bar.append(results, input, clearBtn);
  container.appendChild(bar);
  L.DomEvent.disableClickPropagation(bar);
  L.DomEvent.disableScrollPropagation(bar);
  let hi = -1, matches = [];

  function show(q) {
    q = q.trim().toLowerCase(); results.innerHTML = '';
    if (!q) { results.style.display = 'none'; return; }
    matches = stations.filter(s => [s.name, s.area, s.net].join(' ').toLowerCase().includes(q)).sort((a, b) => a.dist - b.dist).slice(0, 30);
    if (!matches.length) { results.style.display = 'none'; return; }
    matches.forEach(s => {
      const item = document.createElement('div'); item.className = 'search-result-item';
      const n = document.createElement('span'); n.textContent = s.name + (s.area ? ` · ${s.area}` : '');
      const c = document.createElement('span'); c.className = 'count'; c.textContent = `${fmtV(s.p)} ${METRICS[metric].unit}`;
      item.append(n, c);
      item.addEventListener('mousedown', e => { e.preventDefault(); pick(s); });
      results.appendChild(item);
    });
    results.style.display = 'block'; hi = -1;
  }
  function pick(s) {
    input.value = s.name; results.style.display = 'none'; clearBtn.style.display = 'inline';
    // make sure it is visible under current filters
    if (!visible(s)) {
      if (s.suspect && suspectFilter === 'exclude') document.querySelector('[data-sus="include"]').click();
      if (srcFilter !== 'all' && srcFilter !== s.src) document.querySelector('[data-src="all"]').click();
      if (s.dist > radius) document.querySelector('[data-rad="500"]').click();
    }
    leafletMap.setView([s.lat, s.lon], 13);
    setTimeout(() => markersById[s.id]?.openPopup(), 300);
  }
  input.addEventListener('input', () => show(input.value));
  input.addEventListener('focus', () => show(input.value));
  input.addEventListener('blur', () => setTimeout(() => results.style.display = 'none', 150));
  input.addEventListener('keydown', e => {
    const items = results.querySelectorAll('.search-result-item');
    if (e.key === 'ArrowDown') { e.preventDefault(); hi = Math.min(hi + 1, items.length - 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); hi = Math.max(hi - 1, -1); }
    else if (e.key === 'Enter') { const s = matches[hi >= 0 ? hi : 0]; if (s) pick(s); }
    else if (e.key === 'Escape') { input.value = ''; clearBtn.style.display = 'none'; results.style.display = 'none'; }
    items.forEach((el, i) => el.classList.toggle('selected', i === hi));
  });
  clearBtn.addEventListener('click', () => { input.value = ''; clearBtn.style.display = 'none'; results.style.display = 'none'; leafletMap.closePopup(); });
}

// ── Live loading ─────────────────────────────────────────────────────────────
const fmtTime = ms => new Date(ms).toLocaleTimeString('en-US', { timeZone: 'America/Denver', hour: 'numeric', minute: '2-digit' });
const titleCase = s => s.toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase()).replace(/\bRaws\b/g, 'RAWS').replace(/\bAp\b/g, 'Airport').replace(/\bCo\b/g, 'CO').replace(/\bNm\b/g, 'NM').replace(/\bUt\b/g, 'UT').replace(/\b(N|S|E|W|Ne|Nw|Se|Sw|Nne|Nnw|Sse|Ssw|Ene|Ese|Wnw|Wsw)\b/g, d => d.toUpperCase());

// ── History (test) ──────────────────────────────────────────────────────────
// Past rain for personal stations, from the same public Ambient feed the
// station dashboards use: lightning.ambientweather.net/device-data, asked per
// station with its device address and its public dashboard address. Each day's
// rain is the end-of-day value of the station's daily rain counter (it resets at
// the station's local midnight); a period's total is the sum of its days.
// Official gauges and SNOTEL stay live-only for now.
let hist = null;                 // { from:'YYYY-MM-DD', to:'YYYY-MM-DD', key, days, label }
const histCache = new Map();     // key|mac -> { total, days:[[date, in]], have, need } | { err:true } | { busy:true }
const HIST_MAX_DAYS = 366;
const HIST_PAR = 6;              // requests at a time
const HIST_MAX_STATIONS = 600;   // per pass, nearest the map center first
const isoDay = ms => new Date(ms).toISOString().slice(0, 10);
const addDays = (ds, n) => isoDay(Date.parse(ds + 'T12:00:00Z') + n * 86400e3);
const dayCount = (a, b) => Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 86400e3) + 1;
const todayDenver = () => { const p = dParts(Date.now()); return `${p.y}-${String(p.m).padStart(2, '0')}-${String(p.d).padStart(2, '0')}`; };
const fmtDay = ds => new Date(ds + 'T12:00:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' });
const tzFmt = new Map();
const localDay = (ms, tz) => {
  let f = tzFmt.get(tz);
  if (!f) { try { f = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }); } catch (e) { f = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Denver', year: 'numeric', month: '2-digit', day: '2-digit' }); } tzFmt.set(tz, f); }
  return f.format(ms);
};
function histWindows(h) {
  const [y, m, d] = h.from.split('-').map(Number), [y2, m2, d2] = addDays(h.to, 1).split('-').map(Number);
  const start = denverMidnight(y, m, d) - 2 * 3600e3, end = Math.min(Date.now(), denverMidnight(y2, m2, d2) + 2 * 3600e3);
  // 5-minute readings for one or two days, hourly for longer periods (the feed returns at most 2,000 per request)
  if (end - start <= 2.25 * 86400e3) return [{ start, end, res: 5 }];
  const out = [];
  for (let s = start; s < end; s += 80 * 86400e3) out.push({ start: s, end: Math.min(end, s + 80 * 86400e3), res: 60 });
  return out;
}
async function fetchHist(st, h) {
  const k = h.key + '|' + st.mac;
  histCache.set(k, { busy: true });
  const dayMax = new Map();
  try {
    for (const w of histWindows(h)) {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
      const r = await fetch('https://lightning.ambientweather.net/device-data?' + new URLSearchParams({
        macAddress: st.mac, dataKey: st.key, start: Math.round(w.start), end: Math.round(w.end), limit: 2000, res: w.res }), { signal: ctl.signal });
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json(), arr = Array.isArray(j) ? j : (j.data || []);
      for (const x of arr) {
        if (x.dailyrainin == null || x.dateutc == null) continue;
        const ds = localDay(x.dateutc, st.tz || 'America/Denver');
        if (ds < h.from || ds > h.to) continue;
        const v = +x.dailyrainin;
        if (!(dayMax.get(ds) >= v)) dayMax.set(ds, v);
      }
    }
    const days = [...dayMax.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1);
    const need = dayCount(h.from, h.to);
    histCache.set(k, days.length ? { total: +days.reduce((a, [, v]) => a + v, 0).toFixed(2), days, have: days.length, need } : { none: true });
  } catch (e) { histCache.set(k, { err: true }); }
}
let histRun = 0;
async function ensureHist() {
  if (!hist) return;
  const run = ++histRun, h = hist;
  const b = leafletMap.getBounds().pad(0.05), ctr = leafletMap.getCenter();
  const todo = [...ambient.values()].filter(s => s.mac && s.key && b.contains([s.lat, s.lon])
      && miles(CENTER.lat, CENTER.lon, s.lat, s.lon) <= radius && (!histCache.has(h.key + '|' + s.mac) || histCache.get(h.key + '|' + s.mac).err))
    .sort((a, z) => (a.lat - ctr.lat) ** 2 + (a.lon - ctr.lng) ** 2 - ((z.lat - ctr.lat) ** 2 + (z.lon - ctr.lng) ** 2))
    .slice(0, HIST_MAX_STATIONS);
  if (!todo.length) { histStatus(); return; }
  let done = 0, i = 0, lastDraw = Date.now();
  const msg = document.getElementById('refresh-msg');
  const worker = async () => {
    while (i < todo.length && run === histRun && hist === h) {
      const st = todo[i++];
      await fetchHist(st, h); done++;
      if (done % 10 === 0) { msg.className = 'refresh-msg'; msg.textContent = `Loading history for ${h.label}: ${done} of ${todo.length} stations…`; }
      // redraw at most every 4 seconds while loading; each redraw recomputes every pin and contour
      if (Date.now() - lastDraw > 4000) { lastDraw = Date.now(); rebuild(); msg.textContent = `Loading history for ${h.label}: ${done} of ${todo.length} stations…`; }
    }
  };
  msg.className = 'refresh-msg'; msg.textContent = `Loading history for ${h.label}: 0 of ${todo.length} stations…`;
  await Promise.all(Array.from({ length: HIST_PAR }, worker));
  if (run !== histRun || hist !== h) return;
  rebuild(); histStatus();
}
function histStatus() {
  if (!hist) return;
  const vals = [...histCache.entries()].filter(([k]) => k.startsWith(hist.key + '|')).map(([, v]) => v);
  const ok = vals.filter(v => v.total != null).length, err = vals.filter(v => v.err).length, none = vals.filter(v => v.none).length;
  const msg = document.getElementById('refresh-msg');
  msg.className = 'refresh-msg' + (err && !ok ? ' err' : '');
  msg.textContent = `History, ${hist.label}: ${ok} personal stations with readings` + (none ? `, ${none} with none for these dates` : '') + (err ? `, ${err} could not be loaded` : '') +
    '. Pan or zoom to load more. Official gauges and SNOTEL are live-only for now.';
}
function setHist(from, to) {
  const days = dayCount(from, to);
  const label = from === to ? fmtDay(from) : `${fmtDay(from)} – ${fmtDay(to)}`;
  hist = { from, to, days, label, key: from + '_' + to };
  METRICS.hist.label = 'Period';
  METRICS.hist.title = `Rain ${label} (in)`;
  METRICS.hist.scale = days <= 1 ? 1 : days <= 7 ? 1.5 : days <= 31 ? 2 : 4;
  metric = 'hist';
  document.querySelectorAll('[data-metric]').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('[data-hist]').forEach(x => x.classList.toggle('active', x.dataset.hist === 'pick'));
  updateLegend(); rebuild(); ensureHist();
}
function exitHist(toMetric) {
  hist = null; histRun++;
  metric = toMetric || 'week';
  document.querySelectorAll('[data-metric]').forEach(x => x.classList.toggle('active', x.dataset.metric === metric));
  document.querySelectorAll('[data-hist]').forEach(x => x.classList.toggle('active', x.dataset.hist === 'live'));
  const pop = document.getElementById('hist-pop'); if (pop) pop.hidden = true;
  updateLegend(); rebuild(); setStatus();
}

// Ambient public network ----------------------------------------------------
const cells = new Map();        // "i,j" -> { t: last load time, busy }
const ambient = new Map();      // device id -> station
let official = [];

const cellInRange = (i, j) => {  // nearest point of the cell to the center is within MAX_RADIUS
  const lat = Math.min(Math.max(DATA_CENTER.lat, i * CELL_LAT), (i + 1) * CELL_LAT);
  const lon = Math.min(Math.max(DATA_CENTER.lon, j * CELL_LON), (j + 1) * CELL_LON);
  return miles(DATA_CENTER.lat, DATA_CENTER.lon, lat, lon) <= MAX_RADIUS;
};

async function fetchBox(w, s, e, n, depth, seen) {
  const q = new URLSearchParams({ '$publicBox[0][0]': w, '$publicBox[0][1]': s, '$publicBox[1][0]': e, '$publicBox[1][1]': n, '$limit': 100 });
  const r = await fetch('https://lightning.ambientweather.net/devices?' + q);
  if (!r.ok) throw new Error('Ambient HTTP ' + r.status);
  const arr = (await r.json()).data || [];
  // The API returns at most 100 devices per box, so split any full box into quarters.
  if (arr.length >= 100 && depth < 6) {
    const mx = (w + e) / 2, my = (s + n) / 2;
    await Promise.all([fetchBox(w, s, mx, my, depth + 1, seen), fetchBox(mx, s, e, my, depth + 1, seen),
                       fetchBox(w, my, mx, n, depth + 1, seen), fetchBox(mx, my, e, n, depth + 1, seen)]);
  } else arr.forEach(x => seen.set(x._id, x));
}

async function loadCell(key, sample) {
  const [i, j] = key.split(',').map(Number);
  const c = cells.get(key) || { t: 0 };
  c.busy = true; cells.set(key, c);
  try {
    const seen = new Map(), now = Date.now();
    await fetchBox(j * CELL_LON, i * CELL_LAT, (j + 1) * CELL_LON, (i + 1) * CELL_LAT, sample ? 99 : 0, seen);
    for (const [id, st] of ambient) if (st.cell === key) ambient.delete(id);
    for (const x of seen.values()) {
      const co = x.info?.coords?.geo?.coordinates, d = x.lastData || {};
      if (!co || d.dailyrainin == null || !(d.dateutc >= now - 3 * 3600e3)) continue;
      const lat = co[1], lon = co[0];
      if (miles(DATA_CENTER.lat, DATA_CENTER.lon, lat, lon) > MAX_RADIUS) continue;
      ambient.set(x._id, { src: 'A', net: 'Ambient', cell: key,
        name: ((x.public && x.public.name) || x.info.name || 'Ambient station').trim(),
        area: (x.info.coords.location || '').trim(), lat, lon,
        v: Object.fromEntries(Object.entries(METRICS).map(([k, m]) => [k, d[m.amb] == null ? null : +(+d[m.amb]).toFixed(2)])),
        time: fmtTime(d.dateutc), slug: x.info?.slug || x.public?.slug, mac: x.macAddress, key: x.info?.slug, tz: x.tz?.name });
    }
    c.t = now; c.err = false; c.sample = !!sample;
  } catch (e) { c.err = true; }
  c.busy = false;
}

let cellRun = 0;
async function ensureCells(force) {
  const hint = document.getElementById('zoom-hint');
  const b = leafletMap.getBounds().pad(0.1);
  const i0 = Math.floor(b.getSouth() / CELL_LAT), i1 = Math.floor(b.getNorth() / CELL_LAT);
  const j0 = Math.floor(b.getWest() / CELL_LON), j1 = Math.floor(b.getEast() / CELL_LON);
  const inView = [];
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) if (cellInRange(i, j)) inView.push(hkey(i, j));
  // Zoomed far out, load a sample (up to 100 stations per cell); closer in, load every station.
  const sample = inView.length > MAX_CELLS;
  hint.style.display = sample ? 'block' : 'none';
  const now = Date.now();
  const need = inView.filter(k => {
    const c = cells.get(k);
    if (!c) return true;
    if (c.busy) return false;
    if (!sample && c.sample) return true;           // upgrade a sampled cell to full detail
    return force || c.err || now - c.t > CELL_TTL;
  });
  if (!need.length) return;
  const run = ++cellRun;
  const msg = document.getElementById('refresh-msg');
  msg.className = 'refresh-msg';
  let done = 0, failed = 0;
  // nearest cells first, eight at a time
  const ctr = leafletMap.getCenter();
  need.sort((a, z) => { const [ai, aj] = a.split(',').map(Number), [zi, zj] = z.split(',').map(Number);
    return Math.hypot(ai + .5 - ctr.lat / CELL_LAT, aj + .5 - ctr.lng / CELL_LON) - Math.hypot(zi + .5 - ctr.lat / CELL_LAT, zj + .5 - ctr.lng / CELL_LON); });
  for (let k = 0; k < need.length; k += 8) {
    msg.textContent = `Loading personal stations for this area (${Math.round(100 * k / need.length)}%)…`;
    await Promise.all(need.slice(k, k + 8).map(async key => { await loadCell(key, sample); done++; if (cells.get(key).err) failed++; }));
    if (k % 32 === 0 || k + 8 >= need.length) rebuild();
  }
  if (run !== cellRun) return;
  setStatus(failed ? `Some areas did not load (${failed} of ${need.length}). Use Refresh to try again.` : '', !!failed);
}

// Official gauges via the Iowa Environmental Mesonet ------------------------
async function loadOfficial() {
  const states = ['CO', 'UT', 'NM', 'AZ', 'WY', 'NV', 'ID', 'TX', 'OK', 'KS', 'NE', 'CA'];
  const nets = ['USCRN', ...states.flatMap(s => [s + '_ASOS', s + '_DCP'])];
  const data = {};
  const res = await Promise.allSettled(nets.map(n => fetch('https://mesonet.agron.iastate.edu/api/1/currents.json?network=' + n)
    .then(r => { if (!r.ok) throw new Error('IEM HTTP ' + r.status); return r.json(); }).then(j => data[n] = j.data || [])));
  if (res.every(r => r.status === 'rejected')) throw new Error('IEM unreachable');
  const out = [];
  for (const n of nets) for (const r of data[n] || []) {
    if (r.pday == null || miles(DATA_CENTER.lat, DATA_CENTER.lon, r.lat, r.lon) > MAX_RADIUS) continue;
    const isDcp = n.endsWith('_DCP'), isRaws = /RAWS/i.test(r.name);
    // DCP platforms are mostly stream gauges whose precip field reads 0 when
    // there is no rain sensor; keep RAWS, and other platforms only if they report rain.
    if (isDcp && !isRaws && !(r.pday > 0)) continue;
    out.push({ n, r, isRaws });
  }
  const kept = [];
  const hash = new Map();
  for (const { n, r, isRaws } of out) {
    const s0 = { lat: r.lat, lon: r.lon };
    if (near(hash, s0, 0.3).length) continue;   // same site in two networks
    const net = n.endsWith('_ASOS') ? 'NWS ASOS' : n === 'USCRN' ? 'NOAA USCRN' : isRaws ? 'RAWS' : 'Remote gauge';
    let name = titleCase(r.name);
    if (n.endsWith('_ASOS')) name += ` (${/^[A-Z]{3}$/.test(r.station) ? 'K' + r.station : r.station})`;
    const st = { src: 'O', net, name, area: n === 'USCRN' ? '' : n.slice(0, 2), lat: r.lat, lon: r.lon,
      v: { rate: r.phour == null ? null : +(+r.phour).toFixed(2), day: +(+r.pday).toFixed(2) },
      time: r.utc_valid ? fmtTime(Date.parse(r.utc_valid)) : (r.local_valid || '').slice(11, 16), iem: { net: n, id: r.station } };
    kept.push(st);
    const k = hkey(Math.floor(st.lat / HASH), Math.floor(st.lon / HASH));
    (hash.get(k) || hash.set(k, []).get(k)).push(st);
  }
  official = kept;
}

// SNOTEL via NRCS -------------------------------------------------------------
// SNOTEL reports a running precipitation total (PREC) that resets to 0 on
// October 1, in tenths of an inch, with timestamps in Pacific Standard Time.
// Rain for a period = how far that total rose since the period began.
let snotel = [];
const AWDB = 'https://wcc.sc.egov.usda.gov/awdbRestApi/services/v1/';
const TZ = 'America/Denver';
function dParts(ms) {
  const o = {};
  for (const x of new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', hourCycle: 'h23', weekday: 'short' }).formatToParts(ms)) o[x.type] = x.value;
  return { y: +o.year, m: +o.month, d: +o.day, h: +o.hour, wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(o.weekday) };
}
function denverMidnight(y, m, d) {   // ms of 00:00 Denver time on that date
  for (const off of [6, 7]) { const t = Date.UTC(y, m - 1, d, off); const q = dParts(t); if (q.h === 0 && q.d === d) return t; }
  return Date.UTC(y, m - 1, d, 7);
}
const pstHour = ms => new Date(ms - 8 * 3600e3).toISOString().slice(0, 13).replace('T', ' ') + ':00';
const pstDay = ms => new Date(ms - 8 * 3600e3).toISOString().slice(0, 10);
const pstMs = s => Date.parse(s.replace(' ', 'T') + (s.length > 10 ? ':00' : 'T00:00:00') + '-08:00');
// Rise of a running total across a series, allowing for the October 1 reset
// and ignoring the gauge's small up-and-down wobble.
function rise(seq) {
  if (seq[0] == null) return null;          // no starting reading, so the period can't be measured
  seq = seq.filter(v => v != null);
  if (seq.length < 2) return seq.length ? 0 : null;
  let base = seq[0], peak = base, carried = 0;
  for (const v of seq.slice(1)) {
    if (peak - v > 0.5) { carried += peak - base; base = 0; peak = v; }
    else if (v > peak) peak = v;
  }
  return +(carried + peak - base).toFixed(2);
}
async function awdb(trips, elements, duration, begin, end) {
  const r = await fetch(`${AWDB}data?stationTriplets=${trips.join(',')}&elements=${elements}&duration=${duration}&beginDate=${encodeURIComponent(begin)}&endDate=${encodeURIComponent(end)}`);
  if (!r.ok) throw new Error('NRCS HTTP ' + r.status);
  const out = {};
  for (const st of await r.json()) for (const el of st.data || []) (out[st.stationTriplet] ||= {})[el.stationElement.elementCode] = el.values || [];
  return out;
}
async function loadSnotel() {
  const r = await fetch(AWDB + 'stations?stationTriplets=' + encodeURIComponent(['CO', 'UT', 'NM', 'AZ', 'WY', 'ID', 'NV'].map(s => `*:${s}:SNTL`).join(',')) + '&returnStationElements=false&activeOnly=true');
  if (!r.ok) throw new Error('NRCS HTTP ' + r.status);
  const sites = (await r.json()).filter(s => miles(DATA_CENTER.lat, DATA_CENTER.lon, s.latitude, s.longitude) <= MAX_RADIUS);
  const now = Date.now(), p = dParts(now);
  const dayStart = denverMidnight(p.y, p.m, p.d);
  const weekStart = dayStart - p.wd * 86400e3;            // week starts Sunday
  const monthStart = denverMidnight(p.y, p.m, 1);
  const hourly0 = pstHour(dayStart - 3600e3), hourly1 = pstHour(now + 3600e3);
  const daily0 = pstDay(Math.min(weekStart, monthStart) - 2 * 86400e3), daily1 = pstDay(now);
  const out = [];
  const chunks = [];
  for (let i = 0; i < sites.length; i += 50) chunks.push(sites.slice(i, i + 50));
  const one = async group => {
    const trips = group.map(s => s.stationTriplet);
    const [H, D, M] = await Promise.all([
      awdb(trips, 'PREC', 'HOURLY', hourly0, hourly1),
      awdb(trips, 'PREC', 'DAILY', daily0, daily1),
      awdb(trips, 'PREC', 'MONTHLY', `${p.y - 1}-12-01`, `${p.y}-${String(p.m).padStart(2, '0')}-01`),
    ]);
    for (const s of group) {
      const h = H[s.stationTriplet] || {}, prec = (h.PREC || []).filter(x => x.value != null);
      if (!prec.length) continue;
      const last = prec[prec.length - 1], lastMs = pstMs(last.date);
      if (now - lastMs > 6 * 3600e3) continue;                       // not reporting
      const atOrBefore = (vals, ms) => { let v = null; for (const x of vals) { if (pstMs(x.date) <= ms) v = x.value; else break; } return v; };
      // Day: from the reading at Denver midnight through the latest hour
      const startDay = atOrBefore(prec, dayStart);
      const day = rise([startDay, ...prec.filter(x => pstMs(x.date) > dayStart).map(x => x.value)]);
      // Week and Month: from the daily total that closed the day before, then on to the latest hour
      const dv = ((D[s.stationTriplet] || {}).PREC || []).filter(x => x.value != null);
      const fromDaily = start => {
        const before = dv.filter(x => pstMs(x.date) + 86400e3 <= start + 3 * 3600e3);
        if (!before.length) return null;
        const seq = [before[before.length - 1].value, ...dv.filter(x => pstMs(x.date) + 86400e3 > start + 3 * 3600e3).map(x => x.value), last.value];
        return rise(seq);
      };
      // Year (January 1 on): last December's closing total, each month's closing total, then the latest hour
      const mv = ((M[s.stationTriplet] || {}).PREC || []).filter(x => x.value != null);
      const dec = mv.find(x => x.year === p.y - 1 && x.month === 12);
      const year = dec ? rise([dec.value, ...mv.filter(x => x.year === p.y && x.month < p.m).map(x => x.value), last.value]) : null;
      out.push({ src: 'S', net: 'SNOTEL', name: `${s.name} SNOTEL`, area: s.stateCode, lat: s.latitude, lon: s.longitude, elev: s.elevation,
        snotel: s.stationId, time: fmtTime(lastMs),
        v: { day, week: fromDaily(weekStart), month: fromDaily(monthStart), year } });
    }
  };
  // three batches at a time; redraw as each set arrives
  for (let i = 0; i < chunks.length; i += 3) {
    await Promise.all(chunks.slice(i, i + 3).map(one));
    snotel = out.slice();
    rebuild();
  }
}

// Combine, de-duplicate and redraw ------------------------------------------
function rebuild() {
  const amb = [];
  const hash = new Map();
  for (const s of ambient.values()) {
    // one owner sometimes registers the same station twice
    const twin = near(hash, s, 0.05).find(o => Math.abs(o.v.day - s.v.day) < 0.01);
    if (twin) { if (!twin.name.includes(s.name)) twin.name += ' / ' + s.name; continue; }
    const c = { ...s };
    if (hist) { const hc = histCache.get(hist.key + '|' + s.mac); c.v = { ...s.v, hist: hc && hc.total != null ? hc.total : null }; c.hist = hc && hc.total != null ? hc : null; }
    amb.push(c);
    const k = hkey(Math.floor(c.lat / HASH), Math.floor(c.lon / HASH));
    (hash.get(k) || hash.set(k, []).get(k)).push(c);
  }
  stations = [...amb, ...(hist ? [] : official), ...(hist ? [] : snotel)].filter(s => s.v[metric] != null).map((s, i) => ({ ...s, p: s.v[metric], id: i }));
  computeDerived(); render();
}

let lastLoad = 0;
function setStatus(extra, isErr) {
  if (hist && !extra) return histStatus();
  const msg = document.getElementById('refresh-msg');
  const a = stations.filter(s => s.src === 'A').length, o = stations.filter(s => s.src === 'O').length, sn = stations.filter(s => s.src === 'S').length;
  msg.className = 'refresh-msg' + (isErr ? ' err' : '');
  const zoomedOut = document.getElementById('zoom-hint').style.display === 'block';
  msg.textContent = extra || `${a} personal, ${o} official and ${sn} SNOTEL gauges loaded, all live. ` +
    (zoomedOut ? 'Zoomed out, so personal stations are a sample; zoom in for all of them.' : 'Personal stations load for the area on screen.');
}

let loading = false;
async function loadData() {
  if (loading) return;
  loading = true;
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true; btn.textContent = 'Loading…';
  setStatus('Pulling official gauges and personal stations…');
  const now = Date.now();
  let offErr = false;
  try { await loadOfficial(); } catch (e) { offErr = true; }
  loadSnotel().then(() => { if (!loading) setStatus(); })
    .catch(() => setStatus('SNOTEL sites could not be loaded (no connection, or the browser blocked it).', true));
  dataTime = `${new Date(now).toLocaleDateString('en-US', { timeZone: 'America/Denver', month: 'long', day: 'numeric' })}, live as of ${fmtTime(now)}`;
  rebuild();
  await ensureCells(true);
  if (hist) await ensureHist();
  btn.disabled = false; btn.textContent = '↻ Refresh live data';
  if (offErr) setStatus('Official gauges could not be loaded (no connection, or the browser blocked it). Showing the last values it had.', true);
  else if (!document.getElementById('refresh-msg').classList.contains('err')) setStatus();
  loading = false;
}

initMap();
