<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>4 Corners Precip Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/d3-array@3.2.4/dist/d3-array.min.js"></script>
<script src="https://unpkg.com/d3-contour@4.0.2/dist/d3-contour.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8fafc;color:#1e293b}
#map{width:100%;height:100vh;height:100dvh}

/* ── Pins ─────────────────────────────────────────────── */
.pin{
  display:flex;align-items:center;justify-content:center;
  border-radius:9px;font-weight:700;font-size:10px;
  font-variant-numeric:tabular-nums;
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  cursor:pointer;height:18px;min-width:32px;padding:0 4px;
}
.pin.suspect{border:1.5px dashed #64748b;background:#e2e8f0 !important;color:#475569 !important}
.pin.official{border-color:rgba(17,24,39,.75);border-width:1.5px}
.pin.dot{min-width:0;width:10px;height:10px;padding:0;border-radius:50%;font-size:0;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.pin.dot.official{width:12px;height:12px;border-radius:2px}
.pin.snotel{border-radius:3px;border:1.5px solid rgba(12,74,110,.8)}
.pin.dot.snotel{width:11px;height:11px;border-radius:2px;transform:rotate(45deg)}
.pin.dot.suspect{border-width:1px}
.has-play .pin{transition:background-color .2s linear,color .2s linear}

/* ── Popup ─────────────────────────────────────────────── */
.st-popup{min-width:220px;font-size:12px;color:#334155}
.st-popup h3{margin:0 0 2px;font-size:14px;color:#1e293b}
.st-popup .sub{color:#64748b;margin-bottom:8px}
.st-popup .big{font-size:22px;font-weight:700;color:#1e293b;font-variant-numeric:tabular-nums}
.st-popup .big small{font-size:12px;font-weight:600;color:#64748b}
.st-popup .row{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px solid #f1f5f9}
.st-popup .row:last-child{border-bottom:none}
.st-popup .row span:last-child{font-weight:600;color:#1e293b;text-align:right}
.st-popup .vals{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:6px 0 8px}
.st-popup .vals div{background:#f1f5f9;border-radius:6px;padding:3px 2px;text-align:center}
.st-popup .vals div.on{background:#dbeafe}
.st-popup .vals b{display:block;font-size:12px;color:#1e293b;font-variant-numeric:tabular-nums}
.st-popup .vals span{font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
.st-popup .warn{margin:6px 0;padding:5px 8px;border-radius:6px;background:#fef3c7;color:#92400e;font-size:11px;line-height:1.4}
.st-popup a{color:#2563eb;text-decoration:none;font-weight:600}
.st-popup a:hover{text-decoration:underline}

/* ── Info panel ────────────────────────────────────────── */
.info-panel{
  background:rgba(255,255,255,.94);color:#1e293b;
  padding:12px 16px 13px;border-radius:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  width:362px;max-width:calc(100vw - 20px);font-size:13px;line-height:1.5;
  backdrop-filter:blur(8px);
}
.info-panel .filters{margin-top:10px;padding-top:9px;border-top:1px solid rgba(0,0,0,.08)}
.refresh-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.refresh-row .panel-btn{margin-top:0;flex:1}
.info-panel h2{font-size:15px;color:#1e293b;margin-bottom:2px}
.info-panel .asof{font-size:11px;color:#64748b;margin-bottom:8px}
.info-panel .stat{display:flex;justify-content:space-between;padding:2px 0;gap:16px}
.info-panel .stat .val{font-weight:600;color:#2563eb;white-space:nowrap;font-variant-numeric:tabular-nums}
.panel-btn{
  display:block;width:100%;margin-top:10px;padding:6px 0;
  border:1px solid rgba(37,99,235,.35);border-radius:6px;
  background:#eff6ff;color:#2563eb;font-size:12px;font-weight:600;
  cursor:pointer;text-align:center;font-family:inherit;
}
.panel-btn:hover{background:#dbeafe}
.panel-btn:disabled{opacity:.6;cursor:wait}
.refresh-msg{font-size:11px;color:#64748b;margin-top:5px;line-height:1.4;height:15px;overflow:hidden;visibility:hidden}
.refresh-msg.show{height:auto;visibility:visible}
#win-hours,#win-days{width:46px}
.refresh-msg.err{color:#b91c1c}

/* ── Filters (inside the panel) ─────────────────────────── */
.opt-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 8px;align-items:center}
.opt-l{font-size:11px;font-weight:600;color:#64748b;text-align:right;white-space:nowrap}
.opt-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg-ctrl.wrap{flex-wrap:wrap;max-width:420px}
.info-btn{width:17px;height:17px;border-radius:50%;border:1.5px solid #94a3b8;background:#fff;color:#64748b;font:italic 700 11px Georgia,serif;line-height:1;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.info-btn:hover,.info-btn.active{border-color:#0891b2;color:#0891b2;background:#ecfeff}
.info-btn:focus-visible{outline:2px solid #0891b2;outline-offset:1px}
.hist-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.hist-row label{display:flex;align-items:center;gap:4px;font-weight:600;color:#475569}
.hist-row select{font:inherit;font-size:12px;padding:2px 4px;border:1px solid rgba(0,0,0,.2);border-radius:5px;background:#fff;color:#1e293b}
.hist-row input[type=date]{font:inherit;font-size:12px;padding:2px 4px;border:1px solid rgba(0,0,0,.2);border-radius:5px;background:#fff;color:#1e293b}
.hist-days{margin:4px 0 6px;max-height:160px;overflow-y:auto;border-top:1px solid #f1f5f9}
.hist-gap{font-size:11px;color:#92400e;margin:3px 0}
.info-btn.gear{font:400 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-style:normal}
.con-grid{display:grid;grid-template-columns:auto auto;gap:5px 8px;align-items:center;justify-content:start}
.con-desc{margin-top:7px;padding-top:6px;border-top:1px solid rgba(0,0,0,.08)}
.sus-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center}
.sus-t{font-size:11px;color:#475569;line-height:2}
.sus-t .leg-num{width:50px}
.con-desc .draw-btn{margin-left:4px}
.con-label{display:inline-block;font-size:10px;font-weight:700;color:#0f172a;background:rgba(255,255,255,.85);border-radius:6px;padding:0 3px;font-variant-numeric:tabular-nums;white-space:nowrap;transform:translateY(0)}
.info-pop{grid-column:1 / -1;font-size:11px;line-height:1.45;color:#475569;background:#f1f5f9;border-radius:6px;padding:7px 9px;max-width:400px}
.filter-row{display:flex;gap:6px;align-items:center}
.filter-row+.filter-row{margin-top:6px;padding-top:6px;border-top:1px solid rgba(0,0,0,.07);justify-content:center;gap:12px}
.filter-btn{
  padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;
  cursor:pointer;border:none;background:rgba(0,0,0,.06);color:#64748b;font-family:inherit;
}
.filter-btn:hover{background:rgba(0,0,0,.1)}
.filter-btn.active{color:#fff;background:#0e7490}
.toggle-btn{display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:none;background:transparent;padding:1px 2px;border-radius:5px;font-family:inherit}
.toggle-btn:hover{background:rgba(0,0,0,.06)}
.toggle-track{display:inline-block;width:26px;height:14px;border-radius:7px;background:rgba(0,0,0,.18);position:relative;transition:background .2s;flex-shrink:0}
.toggle-thumb{position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.toggle-btn.active .toggle-track{background:#0891b2}
.toggle-btn.active .toggle-thumb{left:14px}
.toggle-label-text{font-size:11px;font-weight:600;color:#64748b}
.toggle-btn.active .toggle-label-text{color:#0891b2}
.seg-ctrl{display:inline-flex;border-radius:5px;overflow:hidden;border:1px solid rgba(0,0,0,.15);justify-self:start}
.seg-btn{padding:2px 6px;border:none;background:#fff;font-family:inherit;font-size:11px;font-weight:600;color:#64748b;cursor:pointer;white-space:nowrap}
.seg-btn:not(:last-child){border-right:1px solid rgba(0,0,0,.12)}
.seg-btn:hover:not(.active){background:rgba(0,0,0,.04)}
.seg-btn.active{background:#0891b2;color:#fff}

/* ── Legend ────────────────────────────────────────────── */
.legend{
  background:rgba(255,255,255,.94);color:#1e293b;
  padding:12px 14px;border-radius:8px;
  box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:12px;backdrop-filter:blur(8px);
}
.legend h4{margin:0 0 6px;font-size:13px}
.legend-row{display:flex;align-items:center;gap:8px;padding:1px 0;font-variant-numeric:tabular-nums}
.legend-sw{width:28px;height:13px;border-radius:7px;border:1px solid rgba(0,0,0,.12);flex-shrink:0}
.legend-sw.suspect{background:#e2e8f0;border:1.5px dashed #475569}
.legend-sw.official{background:#fff;border:2.5px solid #111827}
.legend-sw.snotel{background:#fff;border:2.5px solid #0c4a6e;border-radius:3px}
.leg-foot{display:flex;align-items:center;gap:10px;margin:7px 0 2px}
.leg-notes{margin-top:6px;max-width:230px}
.leg-notes>div+div{margin-top:5px}
.leg-adj-btn{border:none;background:none;padding:0;margin-left:2px;color:#0e7490;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.leg-adj-btn:hover{text-decoration:underline}
.leg-adj{display:grid;grid-template-columns:auto auto;gap:5px 7px;align-items:center;margin:4px 0 2px;padding:7px 0 3px;border-top:1px solid rgba(0,0,0,.08)}
.leg-adj[hidden]{display:none}
.leg-adj .seg-btn:disabled{opacity:.4;cursor:default}
.leg-num{width:54px;font:inherit;font-size:11px;font-weight:600;padding:2px 5px;border:1px solid rgba(0,0,0,.2);border-radius:5px;background:#fff;color:#1e293b}
.leg-num:disabled{opacity:.4}
.leg-num.active{border-color:#0891b2;box-shadow:0 0 0 2px rgba(8,145,178,.3)}
.leg-num-wrap{white-space:nowrap;color:#64748b;font-size:11px}
.legend .panel-body{max-height:calc(100vh - 220px);max-height:calc(100dvh - 220px);overflow-y:auto}

/* ── Draw control ───────────────────────────────────────── */
.draw-control{background:rgba(255,255,255,.94);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);display:flex;gap:4px;padding:8px 10px}
.draw-btn{padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:rgba(0,0,0,.06);color:#64748b;font-family:inherit}
.draw-btn:hover{background:rgba(0,0,0,.1);color:#334155}
.draw-btn.active{background:#f59e0b;color:#fff}
.draw-btn.poly.active{background:#8b5cf6;color:#fff}
.draw-clear{padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:rgba(239,68,68,.12);color:#ef4444;display:none;font-family:inherit}
.draw-clear:hover{background:rgba(239,68,68,.22)}
.draw-sep{width:1px;background:rgba(0,0,0,.12);margin:0 2px;align-self:stretch}
.draw-active{cursor:crosshair !important}
.draw-active .leaflet-interactive{pointer-events:none}

/* ── Boundaries (v1.73) ─────────────────────────────────── */
.opt-l[hidden],.opt-row[hidden]{display:none}
.bnd-label{font:600 10px/1.15 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1e3a8a;text-align:center;white-space:normal;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff,0 0 1px #fff;pointer-events:none;letter-spacing:.01em}
.bnd-label.county{color:#334155;font-weight:500;font-size:9.5px}
.bnd-chip{display:inline-flex;align-items:center;gap:2px;background:#e0e7ff;color:#1e3a8a;border-radius:999px;padding:1px 4px 1px 8px;font-size:11px;max-width:100%}
.bnd-chip b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px;cursor:pointer}
.bnd-chip button{border:none;background:none;color:#1e3a8a;font:inherit;font-size:14px;line-height:1;cursor:pointer;padding:0 3px}
.bnd-pick{font-size:12px;min-width:210px;max-width:300px}
.bnd-pick .hd{font-weight:600;color:#475569;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.bnd-pick .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid #f1f5f9}
.bnd-pick .r:last-child{border-bottom:none}
.bnd-pick .r span{line-height:1.25;color:#1e293b}
.bnd-pick .r small{display:block;color:#64748b;font-size:10.5px}
.bnd-pick button{border:1px solid #cbd5e1;background:#fff;color:#1e40af;font:inherit;font-size:11px;font-weight:600;border-radius:6px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.bnd-pick button.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.leaflet-tooltip.bnd-tip{background:rgba(255,255,255,.96);border:1px solid #cbd5e1;border-radius:6px;padding:3px 8px;font-size:11px;color:#1e293b;box-shadow:0 1px 4px rgba(0,0,0,.15);white-space:nowrap;line-height:1.3}
.leaflet-tooltip.bnd-tip::before{display:none}
.leaflet-popup-content:has(.bnd-pick){margin:10px 12px}
/* ── Selection stats panel ──────────────────────────────── */
#sel-panel{
  position:absolute;bottom:28px;left:12px;z-index:1000;
  background:rgba(255,255,255,.95);color:#1e293b;
  padding:12px 14px;border-radius:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  width:300px;max-width:calc(100vw - 24px);font-size:12px;display:none;
}
.sel-header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;color:#475569;margin-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.sel-close{border:none;background:rgba(239,68,68,.12);color:#ef4444;font:inherit;font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;padding:4px 10px;border-radius:6px;cursor:pointer;flex-shrink:0}
.sel-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.sel-stats div{background:#f1f5f9;border-radius:6px;padding:4px 6px;text-align:center}
.sel-stats b{display:block;font-size:14px;color:#1e293b;font-variant-numeric:tabular-nums}
.sel-stats span{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
.sel-list{max-height:180px;overflow-y:auto;border-top:1px solid #e2e8f0}
.sel-list .r{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid #f1f5f9;cursor:pointer}
.sel-list .r:hover{color:#2563eb}
.sel-list .r b{font-variant-numeric:tabular-nums}
.sel-list .r.sus{color:#94a3b8}
.sel-copy{margin-top:8px;width:100%;padding:5px 0;border:1px solid rgba(37,99,235,.35);border-radius:6px;background:#eff6ff;color:#2563eb;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit}
.sel-copy:hover{background:#dbeafe}

/* ── Radius label ───────────────────────────────────────── */
.ring-label{font-size:11px;font-weight:700;color:#dc2626;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:8px;white-space:nowrap;border:1px solid rgba(220,38,38,.3)}

/* ── App name and version ───────────────────────────────── */
.app-name{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#94a3b8;margin-bottom:3px}
.app-name span{font-weight:500;letter-spacing:0;text-transform:none}

/* ── Collapsible panels ─────────────────────────────────── */
.panel-head{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;padding:0;cursor:pointer;font-family:inherit;color:inherit;text-align:left}
.panel-head h2,.panel-head h4{margin:0;flex:1;white-space:nowrap}
.info-panel .panel-head h2,.legend .panel-head h4{white-space:normal;min-width:0}
.legend .panel-head h4{max-width:230px}
.panel-head .summary{font-size:12px;font-weight:600;color:#2563eb;white-space:nowrap;font-variant-numeric:tabular-nums}
.panel-head .chev{font-size:12px;color:#64748b;transition:transform .2s}
.collapsed .panel-head .chev{transform:rotate(-90deg)}
.collapsed .panel-body{display:none}
.panel-body{margin-top:8px}
.info-panel:not(.collapsed) .panel-head .summary{display:none}
.legend.collapsed{padding:8px 12px}

/* ── Draw hint ──────────────────────────────────────────── */
#draw-hint{
  position:absolute;left:50%;transform:translateX(-50%);top:62px;z-index:1001;
  display:none;align-items:center;gap:10px;
  background:#1e293b;color:#fff;font-size:13px;font-weight:600;
  padding:8px 8px 8px 14px;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.3);white-space:nowrap;
}
#draw-hint button{border:none;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-size:12px;padding:5px 10px;border-radius:14px;cursor:pointer}

#zoom-hint{display:none !important;   /* v1.62: the zoomed-out notice is not shown; the status line still mentions the sampling */
  position:absolute;left:50%;transform:translateX(-50%);bottom:34px;z-index:1000;
  background:#1e293b;color:#fff;font-size:12px;font-weight:600;line-height:1.35;text-align:center;
  padding:8px 14px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:min(420px,calc(100vw - 40px));
}

/* ── Playback bar (hourly history) ─────────────────────── */
#play-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:30px;z-index:1000;display:none;
  width:min(560px,calc(100vw - 820px));min-width:380px;background:rgba(255,255,255,.96);color:#1e293b;border-radius:10px;
  box-shadow:0 4px 18px rgba(0,0,0,.22);padding:8px 12px 9px;font-size:12px;backdrop-filter:blur(8px)}
#play-bar.on{display:block}
#play-bar .pb-top{display:flex;align-items:center;gap:10px}
#play-bar .pb-chev{border:none;background:transparent;color:#64748b;font-size:13px;cursor:pointer;padding:2px 4px;transition:transform .2s;flex-shrink:0}
#play-bar .pb-chev:hover{color:#1e293b}
#play-bar.min .pb-chev{transform:rotate(-90deg)}
#play-bar.min #play-range,#play-bar.min .pb-row{display:none}
#play-bar.min{width:auto;min-width:0;padding:6px 10px}
#play-btn{width:34px;height:34px;border-radius:50%;border:none;background:#0e7490;color:#fff;font-size:14px;line-height:1;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#play-btn:hover{background:#155e75}
#play-btn:focus-visible,#play-range:focus-visible{outline:2px solid #0891b2;outline-offset:2px}
#play-time{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;flex:1;min-width:0}
#play-time small{display:block;font-weight:600;font-size:11px;color:#64748b}
#play-range{width:100%;margin:7px 0 3px;accent-color:#0e7490;cursor:pointer}
#play-bar .pb-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:#64748b;font-size:11px}
#play-bar .step-btn{border:1px solid rgba(0,0,0,.15);background:#fff;border-radius:5px;padding:2px 7px;font:inherit;font-weight:700;color:#475569;cursor:pointer}
#play-bar .step-btn:hover{background:#f1f5f9}

/* ── Credit line ────────────────────────────────────────── */
.leaflet-control-attribution{white-space:normal;max-width:calc(100vw - 20px);line-height:1.35;font-size:11px;text-align:right}
.leaflet-control-attribution .cr{white-space:nowrap}

/* ── Phones ─────────────────────────────────────────────── */
@media (max-width:700px){
  .leaflet-control-zoom{display:none}
  .leaflet-top{top:env(safe-area-inset-top,0px)}
  .leaflet-top .leaflet-control{margin-top:8px}
  .leaflet-left .leaflet-control{margin-left:8px}
  .leaflet-right .leaflet-control{margin-right:8px}
  .info-panel{width:auto;max-width:calc(100vw - 72px);padding:7px 10px 8px;font-size:12px;line-height:1.4}
  .info-panel h2{font-size:13px}
  .info-panel .asof{font-size:10px;margin-bottom:4px}
  .info-panel .stat{padding:0}
  .refresh-row{margin-top:6px}
  .refresh-msg{height:0;margin-top:0}

<body>
<div id="map"></div>

<script>
// ── Data ────────────────────────────────────────────────────────────────────
// Ambient Weather Network and official gauges (NWS ASOS, RAWS and other remote
// gauges, NOAA USCRN via the Iowa Environmental Mesonet) load live each time
// the page opens and on Refresh.
// Version shown on the map. Bump it with every published change.
const APP_VERSION = '1.73 test 2';
const CENTER = { name: 'Four Corners', lat: 36.99898, lon: -109.04517 };
const DATA_CENTER = { lat: CENTER.lat, lon: CENTER.lon };   // Four Corners Monument, 36°59′56″N 109°02′43″W
const MAX_RADIUS = 500;    // miles; nothing beyond this is loaded or shown
// Ambient stations load by map area as people pan and zoom, in cells of
// 1° latitude by 1.2° longitude (about 70 by 66 miles).
const CELL_LAT = 1.0, CELL_LON = 1.2;
const MAX_CELLS = 120;          // past this many cells on screen, ask the viewer to zoom in
const CELL_TTL = 15 * 60e3;     // reload a cell's stations when they are older than 15 minutes

// ── What to show, and its color classes ─────────────────────────────────────
// Ambient stations report the seven rain values. NWS, RAWS and USCRN gauges report
// only the past hour (used for Rate) and the day's total. SNOTEL sites give Day,
// Week, Month and Year from their running precipitation total.
// (Snow water equivalent and snow depth are planned for v2.)
// "check" says whether the likely-erroneous test applies; Year depends
// on when each gauge was installed or reset, so neighbors can't be compared fairly.
// "scale" sizes that test's inch thresholds to the value being shown.
const METRICS = {
  rate:  { label: 'Rate',  title: 'Rain in the past hour (in/hr)',     unit: 'in/hr', amb: 'hourlyrainin',  off: 'phour', breaks: [0.01, 0.05, 0.10, 0.20, 0.30, 0.50, 0.75, 1.00], scale: 0.25, check: true },
  day:   { label: 'Today', title: 'Rain since midnight (in)',          unit: 'in',    amb: 'dailyrainin',   off: 'pday',  breaks: [0.01, 0.25, 0.50, 0.75, 1.00, 1.25, 1.50, 2.00, 2.50, 3.00, 3.50, 4.00], scale: 1,    check: true },
  event: { label: 'Event', title: 'Rain this storm (in)',              unit: 'in',    amb: 'eventrainin',               breaks: [0.01, 0.25, 0.50, 0.75, 1.00, 1.25, 1.50, 2.00, 2.50, 3.00, 3.50, 4.00], scale: 1,    check: true },
  week:  { label: 'This week',  title: 'Rain this week (in)',               unit: 'in',    amb: 'weeklyrainin',              breaks: [0.01, 0.25, 0.50, 0.75, 1.00, 1.25, 1.50, 2.00, 2.50, 3.00, 3.50, 4.00], scale: 1.5,  check: true },
  month: { label: 'This month', title: 'Rain this month (in)',              unit: 'in',    amb: 'monthlyrainin',             breaks: [0.01, 0.25, 0.50, 0.75, 1.00, 1.25, 1.50, 2.00, 2.50, 3.00, 3.50, 4.00], scale: 2,    check: true },
  hist:  { label: 'Period', title: 'Rain for the dates picked (in)',    unit: 'in',                                              breaks: [0.01, 0.25, 0.50, 0.75, 1.00, 1.25, 1.50, 2.00, 2.50, 3.00, 3.50, 4.00], scale: 1.5,  check: true },
  year:  { label: 'Year',  title: 'Rain this year (in)',               unit: 'in',    amb: 'yearlyrainin',              breaks: [0.01, 2, 4, 6, 8, 10, 12, 15],                   scale: 10,   check: false, max: 80 },
};
// Color schemes (legend → Adjust → Colors), lowest class first; text color follows the shade.
const SCHEMES = {
  classic: { label: 'Classic', hex: ['#e5f5e0', '#a1d99b', '#31a354', '#41b6c4', '#2c7fb8', '#253494', '#7a0177', '#c51b8a', '#e31a1c', '#a50f15', '#f16913', '#1f1f1f'] },
  blues:   { label: 'Blues',   hex: ['#eff6ff', '#dbeafe', '#bfdbfe', '#93c5fd', '#60a5fa', '#3b82f6', '#2563eb', '#1d4ed8', '#1e40af', '#1e3a8a', '#172554', '#0b1130'] },
  heat:    { label: 'Heat',    hex: ['#ffffcc', '#ffeda0', '#fed976', '#feb24c', '#fd8d3c', '#fc4e2a', '#e31a1c', '#bd0026', '#800026', '#4a0012', '#2a000a', '#000000'] },
  viridis: { label: 'Viridis', hex: ['#fde725', '#c2df23', '#86d549', '#52c569', '#2ab07f', '#1e9b8a', '#25858e', '#2d708e', '#38588c', '#433e85', '#482173', '#440154'] },
  gray:    { label: 'Gray',    hex: ['#f5f5f5', '#e5e5e5', '#d4d4d4', '#c0c0c0', '#a8a8a8', '#8f8f8f', '#777777', '#5f5f5f', '#484848', '#333333', '#1f1f1f', '#000000'] },
};
function schemeColors(k) {
  return SCHEMES[k].hex.map(bg => { const [r, g, b] = [1, 3, 5].map(i => parseInt(bg.slice(i, i + 2), 16)); return { bg, fg: (r * 299 + g * 587 + b * 114) / 1000 >= 142 ? '#0f172a' : '#fff' }; });
}
let colorScheme = 'classic';
let COLORS = schemeColors(colorScheme);
let metric = 'day';
const fmtV = v => v >= 100 ? v.toFixed(0) : v.toFixed(2);
// Build legend classes from a list of lower bounds. The fixed brackets keep their
// set colors; fitted brackets spread the twelve colors across however many steps there are.
const r2 = v => Math.round(v * 100) / 100;
// More steps than colors: a color part of the way (t, 0–1) along the ramp, mixed from its two neighbors.
function rampColor(t) {
  const x = Math.max(0, Math.min(1, t)) * (COLORS.length - 1), k = Math.min(COLORS.length - 2, Math.floor(x)), f = x - k;
  if (f < 1e-9) return COLORS[k];
  if (f > 1 - 1e-9) return COLORS[k + 1];
  const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const a = hex(COLORS[k].bg), b = hex(COLORS[k + 1].bg), m = a.map((v, i) => Math.round(v + (b[i] - v) * f));
  const yiq = (m[0] * 299 + m[1] * 587 + m[2] * 114) / 1000;   // light text on dark mixes
  return { bg: '#' + m.map(v => v.toString(16).padStart(2, '0')).join(''), fg: yiq >= 142 ? '#0f172a' : '#fff' };
}
function makeClasses(b, fixed) {
  const whole = b.length > 1 && b.slice(1).every(v => Number.isInteger(v));
  const lo = v => whole && v >= 1 ? String(v) : v.toFixed(2);
  const col = i => fixed || b.length === COLORS.length ? COLORS[i]
    : b.length < COLORS.length ? COLORS[b.length === 1 ? 0 : Math.round(i * (COLORS.length - 1) / (b.length - 1))]
    : rampColor(i / (b.length - 1));
  return b.map((min, i) => {
    const hi = i < b.length - 1 ? r2(b[i + 1] - 0.01) : null;
    return { min, ...col(i), label: hi == null ? lo(min) + '+' : hi <= min ? lo(min) : `${lo(min)} – ${hi.toFixed(2)}` };
  }).reverse();
}

// ── Legend brackets ──
// Fixed: the set brackets in METRICS. Fitted to the readings: from every gauge
// loaded within the radius (default) or only the gauges on screen, in equal steps
// (default) or equal counts, with up to 12 steps (default). Likely-erroneous
// readings are left out so one bad gauge can't stretch the scale.
let legendRange = 'loaded';     // 'fixed' | 'loaded' | 'screen'
let legendMethod = 'equal';     // 'equal' | 'count'
let legendSteps = 16;
const LEG_MIN = 4, LEG_MAX = 30;
let legendAdjOpen = false, legendInfoOpen = false;
let scaleInfo = '', legendSig = '';
let BREAKS = METRICS[metric].breaks;
let CLASSES = makeClasses(BREAKS, true);
// round step sizes: 0.01, 0.02 … 0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50, 0.75, 1, 1.5 … 750
const NICE = [-2, -1, 0, 1, 2].flatMap(e => [1, 1.5, 2, 2.5, 3, 4, 5, 7.5].map(m => +(m * 10 ** e).toPrecision(3))).filter(v => r2(v) === v);
const niceStep = x => { let s = NICE[0]; for (const n of NICE) if (n <= x + 1e-9) s = n; return s; };
function fitBreaks(vals, n) {
  const pos = vals.filter(v => v >= 0.01).sort((a, b) => a - b);
  if (pos.length < 2) return null;
  const hi = pos[pos.length - 1];
  const b = [0.01];
  if (legendMethod === 'equal') {
    // round steps (0.10, 0.25, 0.50 …) as close to range / number as possible; the top
    // step is open-ended (for example 2.75+). Steps above the wettest reading are left off.
    const step = niceStep(hi / n);
    const k = Math.min(n, Math.floor(hi / step + 1e-9) + 1);
    for (let i = 1; b.length < k; i++) { const v = r2(i * step); if (v > b[b.length - 1]) b.push(v); }
  } else {
    // each step holds about the same number of gauges
    for (let i = 1; i < n; i++) {
      const v = r2(pos[Math.min(pos.length - 1, Math.floor(i * pos.length / n))]);
      if (v > b[b.length - 1]) b.push(v);
    }
  }
  return b;
}
// Recompute the brackets for what's loaded; returns true when they changed.
function updateScale() {
  let b = null;
  scaleInfo = '';
  if (play) {   // playback: brackets held for the whole run so colors can be compared frame to frame
    BREAKS = play.breaks; CLASSES = makeClasses(BREAKS, false);
    scaleInfo = play.mode === 'total' ? 'Brackets fit the totals for the whole period, held while playing.' : 'Brackets fit single hours, up to the wettest 1% of rainy hours in the period, held while playing.';
    const sig = ['play', play.mode, BREAKS.join(','), legendAdjOpen, contourMode, conMethod, conEdge, colorScheme].join('|');
    if (!legendEl) return false;
    if (sig !== legendSig) { legendSig = sig; updateLegend(); }
    const info = legendEl.querySelector('#leg-info'); if (info) info.textContent = scaleInfo;
    return false;
  }
  if (legendRange !== 'fixed') {
    const vb = legendRange === 'screen' && leafletMap ? leafletMap.getBounds() : null;
    const vals = [];
    for (const s of stations) {
      if (s.suspect || s.p == null || s.dist > radius + 1e-9 || (srcFilter !== 'all' && s.src !== srcFilter)) continue;
      if (vb && !vb.contains([s.lat, s.lon])) continue;
      vals.push(s.p);
    }
    b = fitBreaks(vals, legendSteps);
    const top = vals.reduce((a, v) => v > a ? v : a, 0);
    scaleInfo = b ? `Brackets fit ${vals.length} gauges ${legendRange === 'screen' ? 'on screen' : 'loaded'}; wettest ${fmtV(top)} ${METRICS[metric].unit}.`
      : 'Too few readings to fit brackets, so the fixed brackets are shown.';
  }
  BREAKS = b || METRICS[metric].breaks;
  CLASSES = makeClasses(BREAKS, !b);
  const sig = [metric, BREAKS.join(','), legendRange, legendMethod, legendSteps, legendAdjOpen, contourMode, conMethod, conEdge, colorScheme].join('|');
  if (!legendEl) return false;
  if (sig !== legendSig) { legendSig = sig; updateLegend(); return true; }
  const info = legendEl.querySelector('#leg-info');
  if (info) info.textContent = scaleInfo || 'Fixed brackets, the same every time.';
  return false;
}
function rainClass(p) { return CLASSES.find(c => p >= c.min) || CLASSES[CLASSES.length - 1]; }

// ── Geometry ─────────────────────────────────────────────────────────────────
const toRad = x => x * Math.PI / 180;
function miles(a1, o1, a2, o2) {
  const R = 3958.8, dl = toRad(a2 - a1), dn = toRad(o2 - o1);
  const h = Math.sin(dl/2)**2 + Math.cos(toRad(a1))*Math.cos(toRad(a2))*Math.sin(dn/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a1, o1, a2, o2) {
  const y = Math.sin(toRad(o2-o1))*Math.cos(toRad(a2));
  const x = Math.cos(toRad(a1))*Math.sin(toRad(a2)) - Math.sin(toRad(a1))*Math.cos(toRad(a2))*Math.cos(toRad(o2-o1));
  const deg = (Math.atan2(y, x)*180/Math.PI + 360) % 360;
  return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(deg/22.5) % 16];
}
function median(a) {
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
}

// ── Station model ────────────────────────────────────────────────────────────
let stations = [];
let dataTime = 'Loading…';

// Flag rule: a gauge is likely erroneous when it reads
//   - under 40% of the nearby median AND at least 0.25 inch less (this catches
//     0.00 readings where it rained, but leaves 0.00 alone where it did not), or
//   - over 2.5 times the nearby median AND at least 1 inch more (2 inches when
//     the comparison has to reach out to 10 miles), or
//   - more than 12 inches, beyond anything this region records in a day.
// "Nearby" is gauges within 3 miles; where fewer than 2 are that close, within 10 miles;
// for high readings only, within 25 miles if still fewer than 2.
// The numbers above are the defaults; Filters ⚙ (Error filter) changes them for the session.
// Inches are for a day's rain and scale with the period (k below: ×1.5 a week, ×2 a month, ×4 beyond).
const SUS_DEF = { hi: 2.5, hiGap: 1, lo: 0.4, loGap: 0.25, r1: 3, r2: 10, r3: 25, cap: 12 };
const SUS = { ...SUS_DEF };
const SUS_LIM = { hi: [1.1, 10], hiGap: [0, 5], lo: [0, 95], loGap: [0, 5], r1: [0.5, 15], r2: [1, 30], r3: [1, 50], cap: [1, 50] };
function susInfoText() {
  return `A reading is flagged when it is under ${Math.round(SUS.lo * 100)}% of nearby gauges and at least ${SUS.loGap} in below them (including 0.00 where nearby gauges show rain), ` +
    `or over ${SUS.hi} times nearby gauges and at least ${SUS.hiGap} in above them (${2 * SUS.hiGap} in when the comparison reaches ${SUS.r2} mi, ${3 * SUS.hiGap} in at ${SUS.r3} mi). ` +
    `Nearby means within ${SUS.r1} mi, or ${SUS.r2} mi where gauges are sparse; high readings at isolated gauges are checked against gauges within ${SUS.r3} mi. ` +
    `Over ${SUS.cap} in is flagged as more than this region records. Inches are for a day's rain and scale up for longer periods. ` +
    `On Event, a storm total smaller than the same gauge's rain today is flagged, since its storm counter was reset partway through. Ambient stations registered twice by the same owner are shown once.`;
}
const HASH = 0.07;  // degrees; a 3x3 block of these covers a 3-mile search
const hkey = (i, j) => i + ',' + j;
function buildHash(list) {
  const m = new Map();
  for (const s of list) {
    const k = hkey(Math.floor(s.lat / HASH), Math.floor(s.lon / HASH));
    (m.get(k) || m.set(k, []).get(k)).push(s);
  }
  return m;
}
function near(hash, s, maxMi) {
  const i = Math.floor(s.lat / HASH), j = Math.floor(s.lon / HASH), out = [];
  const span = Math.ceil(maxMi / 3.4);   // one cell is at least 3.4 mi across in this region
  for (let a = -span; a <= span; a++) for (let b = -span; b <= span; b++)
    for (const o of hash.get(hkey(i + a, j + b)) || []) if (o !== s && miles(s.lat, s.lon, o.lat, o.lon) <= maxMi) out.push(o);
  return out;
}
function computeDerived() {
  for (const s of stations) {
    s.dist = miles(CENTER.lat, CENTER.lon, s.lat, s.lon);
    s.dir = bearing(CENTER.lat, CENTER.lon, s.lat, s.lon);
  }
  const hash = buildHash(stations);
  // Compare each gauge with the median of its neighborhood, itself included, so
  // one bad gauge cannot make its good neighbors look wrong. High readings are
  // found first and left out when checking for low ones.
  const hood = (s, skip, wide) => {
    let r = SUS.r1, nb = near(hash, s, SUS.r1).filter(o => !(skip && skip.has(o)));
    if (nb.length < 2) { r = SUS.r2; nb = near(hash, s, SUS.r2).filter(o => !(skip && skip.has(o))); }
    // isolated gauges: look out to 25 mi (r3), but only when testing for high readings
    if (nb.length < 2 && wide) { r = SUS.r3; nb = near(hash, s, SUS.r3).filter(o => !(skip && skip.has(o))); }
    return nb.length >= 2 ? { med: median([...nb.map(o => o.p), s.p]), n: nb.length, r } : null;
  };
  const M = METRICS[metric], k = M.scale, U = M.unit;
  const highs = new Set();
  for (const s of stations) { s.why = ''; s.suspect = false; s.nbMed = null; }
  if (!M.check) {
    // Year can't be compared with neighbors, but some totals are impossible for this region.
    if (M.max) for (const s of stations) if (s.p > M.max) { s.suspect = true; s.why = `Reads over ${M.max} in for the year, more than this region gets. Gauge error.`; }
    return;
  }
  for (const s of stations) {
    if (s.p > SUS.cap * k) {   // beyond anything this region records
      highs.add(s); s.suspect = true;
      s.why = 'Reads more rain than this region records. Gauge error.';
      continue;
    }
    const h0 = hood(s, null, true);
    // wider neighborhoods need a bigger gap, since storm cells can be that small
    const gap = (h0 ? (h0.r === SUS.r1 ? 1 : h0.r === SUS.r2 ? 2 : 3) : 0) * SUS.hiGap * k;
    if (h0 && s.p > SUS.hi * h0.med && s.p - h0.med >= gap) {
      highs.add(s); s.suspect = true; s.nbMed = h0.med;
      s.why = `Reads far above nearby gauges (median ${h0.med.toFixed(2)} ${U}, ${h0.n} gauges within ${h0.r} mi). Possible gauge problem, such as sprinkler water or a stuck tipping bucket.`;
    }
  }
  for (const s of stations) {
    if (highs.has(s)) continue;
    // a storm total can't be smaller than today's total: the storm counter was reset partway through
    if (metric === 'event' && s.v.day != null && s.p < s.v.day - 0.05) {
      s.suspect = true;
      s.why = `Storm total (${fmtV(s.p)} in) is less than today's rain (${fmtV(s.v.day)} in), so the gauge's storm counter was reset partway through this storm.`;
      continue;
    }
    const h1 = hood(s, highs);
    s.nbMed = h1 ? h1.med : null;
    if (h1 && s.p < SUS.lo * h1.med && h1.med - s.p >= SUS.loGap * k) {
      s.suspect = true;
      s.why = s.p === 0
        ? `Reads 0.00 while nearby gauges show rain (median ${h1.med.toFixed(2)} ${U}, ${h1.n} gauges within ${h1.r} mi). Likely no rain gauge or a failed gauge.`
        : `Reads far below nearby gauges (median ${h1.med.toFixed(2)} ${U}, ${h1.n} gauges within ${h1.r} mi). Possible gauge problem, such as a clogged funnel.`;
    }
  }
}

// ── State ────────────────────────────────────────────────────────────────────
let leafletMap, markerLayer, ringLayer;
let srcFilter = 'all';          // 'all' | 'A' (Ambient) | 'O' (official) | 'S' (SNOTEL)
let suspectFilter = 'exclude';  // 'exclude' | 'include' | 'only'
let radius = 250;               // miles
let clusteringEnabled = true;   // on by default: hundreds of gauges at 100 mi
let pinStyle = 'label';
let pinsHidden = false;          // hide pins and clusters, e.g. to see contours only
let activeBBox = null, drawMode = false, drawRect = null, drawStart = null;
let polyMode = false, polyDrawing = false, activePoly = null, polyVertices = [], polyPreviewLayer = null, polyLayer = null;
const markersById = {};
let contourMode = 'surface';        // 'off' | 'lines' | 'filled' | 'surface'
let contourLayer = null;
let conReachMi = 13;            // contours reach this far from each gauge; the map is blank beyond it (typed in Contours ⚙)
let conAuto = true;             // Auto: the reach follows the view, as far as it takes to leave no blank spot inside the radius
let syncReachUi = () => {};     // set by the Filters panel: shows the reach in its box and the notes
const REACH_MIN = 1, REACH_MAX = 100;
const fmtReach = () => String(conReachMi);
const conText = t => t.replace(/\{R\}/g, fmtReach());   // '{R}' in the contour texts is the reach in miles

function visible(s, ignoreRegion) {
  if (s.dist > radius + 1e-9) return false;
  if (srcFilter !== 'all' && s.src !== srcFilter) return false;
  if (suspectFilter === 'exclude' && s.suspect) return false;
  if (suspectFilter === 'only' && !s.suspect) return false;
  if (!ignoreRegion) {
    if (activeBBox && (s.lat < activeBBox.minLat || s.lat > activeBBox.maxLat || s.lon < activeBBox.minLon || s.lon > activeBBox.maxLon)) return false;
    if (activePoly && !pointInPolygon(s.lat, s.lon, activePoly)) return false;
    if (bndIso && bndSel.length && !stationIn(s)) return false;
  }
  return true;
}

// ── Map ──────────────────────────────────────────────────────────────────────

        zGrid = new Float32Array(W * H);
        for (let gy = 0; gy < H; gy++) for (let gx = 0; gx < W; gx++) { const e = elevAtC(ox + gx * STEP, oy + gy * STEP); zGrid[gy * W + gx] = e == null ? NaN : e; }
        conNote = `Rain changes about ${fmtV(Math.abs(b) * 304.8)} ${METRICS[metric].unit} per 1,000 ft ${b >= 0 ? 'higher' : 'lower'} for gauges on screen.`;
      }
    }
  }
  const h2 = 2 * (SMOOTH_MI * pxPerMile) ** 2;
  const gam = vg ? h => h <= 0 ? 0 : vg.c0 + vg.c * (1 - Math.exp(-3 * h / vg.a)) : null;
  const vals = new Float64Array(W * H), dmin = new Float64Array(W * H), cnt = nbCount;
  const A = new Float64Array(13 * 13), rhs = new Float64Array(13);
  for (let i = 0; i < W * H; i++) {
    const a0 = nbStart[i], a1 = nbStart[i + 1], n = a1 - a0;   // this cell's gauges, nearest first
    dmin[i] = n ? Math.sqrt(nbD2[a0]) : Infinity;
    if (!n) { vals[i] = -1; continue; }
    let v;
    if (method === 'idw') {
      if (nbD2[a0] < 0.25) v = P[nbIdx[a0]][2];
      else { let sw = 0, sv = 0; for (let q = a0; q < a1; q++) { const w = 1 / nbD2[q]; sw += w; sv += w * P[nbIdx[q]][2]; } v = sv / sw; }
    } else if (method === 'smooth') {
      let sw = 0, sv = 0;
      for (let q = a0; q < a1; q++) { const w = Math.exp(-nbD2[q] / h2); sw += w; sv += w * P[nbIdx[q]][2]; }
      v = sw > 1e-300 ? sv / sw : P[nbIdx[a0]][2];
    } else if (method === 'elev') {
      let sw = 0, sv = 0;
      for (let q = a0; q < a1; q++) { const w = Math.exp(-nbD2[q] / h2); sw += w; sv += w * P[nbIdx[q]][4]; }
      const zz = zGrid[i], res = sw > 1e-300 ? sv / sw : 0;
      v = Number.isNaN(zz) ? null : Math.min(1.25 * maxP, Math.max(0, trend(zz) + res));
      if (v == null) { let s2 = 0, s1 = 0; for (let q = a0; q < a1; q++) { const w = Math.exp(-nbD2[q] / h2); s1 += w; s2 += w * P[nbIdx[q]][2]; } v = s1 > 1e-300 ? s2 / s1 : P[nbIdx[a0]][2]; }
    } else {   // ordinary kriging with the nearest 12 gauges
      const k = Math.min(12, n);
      if (k === 1) v = P[nbIdx[a0]][2];
      else {
        const m = k + 1;
        for (let r = 0; r < k; r++) {
          const gr = P[nbIdx[a0 + r]];
          for (let t = 0; t < k; t++) { const gs = P[nbIdx[a0 + t]]; A[r * m + t] = gam(Math.hypot(gr[0] - gs[0], gr[1] - gs[1])); }
          A[r * m + k] = 1; A[k * m + r] = 1; rhs[r] = gam(Math.sqrt(nbD2[a0 + r]));
        }
        A[k * m + k] = 0; rhs[k] = 1;
        const lam = solveLinear(A.subarray(0, m * m), rhs.subarray(0, m), m);
        if (!lam) { let sw = 0, sv = 0; for (let r = 0; r < k; r++) { const w = 1 / Math.max(nbD2[a0 + r], 0.25); sw += w; sv += w * P[nbIdx[a0 + r]][2]; } v = sv / sw; }
        else { v = 0; for (let r = 0; r < k; r++) v += lam[r] * P[nbIdx[a0 + r]][2]; v = Math.min(maxP, Math.max(0, v)); }
      }
    }
    vals[i] = v;
  }
  // Lines come from a copy where blank cells take the value of the nearest
  // estimated cell, then get trimmed to the estimated area, so the edge of the
  // blank area doesn't draw a stack of false lines.
  const inside = new Uint8Array(W * H), ext = Float64Array.from(vals), queue = [];
  const iso = bndIso && bndSel.length ? isoMask(W, H, ox, oy, STEP, sig) : null;   // picked boundaries: the estimate stops at their edge
  for (let i = 0; i < W * H; i++) if (vals[i] >= 0 && (conEdge !== 'three' || cnt[i] >= 3) && (!iso || iso[i])) { inside[i] = 1; queue.push(i); }
  if (!queue.length) return updateConNote();
  const seen = Uint8Array.from(inside);
  for (let h = 0; h < queue.length; h++) {
    const i = queue[h], x = i % W, y = (i - x) / W;
    for (const j of [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, y > 0 ? i - W : -1, y < H - 1 ? i + W : -1])
      if (j >= 0 && !seen[j]) { seen[j] = 1; ext[j] = ext[i]; queue.push(j); }
  }
  // Distance only: light smoothing (two 3x3 passes) so single gauges don't each draw a small ring
  if (method === 'idw') for (let pass = 0; pass < 2; pass++) {
    const src = Float64Array.from(ext);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let t = 0, n = 0;
      for (let b = -1; b <= 1; b++) for (let a = -1; a <= 1; a++) {
        const xx = x + a, yy = y + b;
        if (xx >= 0 && yy >= 0 && xx < W && yy < H) { t += src[yy * W + xx]; n++; }
      }
      ext[y * W + x] = t / n;
    }
  }
  const isIn = (x, y) => {   // contour points sit between grid cells; keep them only where all four are estimated
    const x0 = Math.floor(x - 0.5), y0 = Math.floor(y - 0.5);
    for (const [a, b] of [[x0, y0], [x0 + 1, y0], [x0, y0 + 1], [x0 + 1, y0 + 1]])
      if (a < 0 || b < 0 || a >= W || b >= H || !inside[b * W + a]) return false;
    return true;
  };
  const breaks = BREAKS;
  const w00 = leafletMap.containerPointToLayerPoint([0, 0]).add(leafletMap.getPixelOrigin()), wScale = 256 * Math.pow(2, leafletMap.getZoom());
  const toLL = ([x, y]) => {   // same as containerPointToLatLng, without building Point and LatLng objects per vertex
    const wx = w00.x + ox + (x - 0.5) * STEP, wy = w00.y + oy + (y - 0.5) * STEP;
    return L.latLng((2 * Math.atan(Math.exp((0.5 - wy / wScale) * 2 * Math.PI)) - Math.PI / 2) * 180 / Math.PI, wx / wScale * 360 - 180);
  };
  const filled = contourMode === 'filled', surface = contourMode === 'surface';
  contourLayer = L.layerGroup();
  if (surface) {
    // Surface (raster): every grid cell painted with its own color, upscaled by the browser so it reads as a
    // continuous surface. Transparent where nothing is estimated; Soft edges fade by distance to the nearest gauge.
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d'), img = ctx.createImageData(W, H), px = img.data;
    const asc = CLASSES.slice().reverse();   // lowest bracket first
    const rgb = asc.map(c => [1, 3, 5].map(i => parseInt(c.bg.slice(i, i + 2), 16)));
    const lo = asc[0].min, soft = conEdge === 'soft', fadeFrom = 0.45 * maskPx, fadeSpan = Math.max(1, maskPx - fadeFrom);
    const opA = Math.round(255 * conSurfOp), smooth = conSurfShade === 'smooth';
    for (let i = 0; i < W * H; i++) {
      if (!inside[i] || dmin[i] > maskPx) continue;
      const v = ext[i]; if (v < lo) continue;
      let k = asc.length - 1; for (let q = 1; q < asc.length; q++) if (v < asc[q].min) { k = q - 1; break; }
      let r, g, b;
      if (smooth && k < asc.length - 1) {
        const t = (v - asc[k].min) / (asc[k + 1].min - asc[k].min), a = rgb[k], c = rgb[k + 1];
        r = a[0] + (c[0] - a[0]) * t; g = a[1] + (c[1] - a[1]) * t; b = a[2] + (c[2] - a[2]) * t;
      } else [r, g, b] = rgb[k];
      let a = opA; if (soft && dmin[i] > fadeFrom) a = Math.round(opA * Math.max(0, 1 - (dmin[i] - fadeFrom) / fadeSpan));
      const o = i * 4; px[o] = r; px[o + 1] = g; px[o + 2] = b; px[o + 3] = a;
    }
    ctx.putImageData(img, 0, 0);
    const nw = leafletMap.containerPointToLatLng([ox - STEP / 2, oy - STEP / 2]), se = leafletMap.containerPointToLatLng([ox + (W - 0.5) * STEP, oy + (H - 0.5) * STEP]);
    L.imageOverlay(cv.toDataURL(), L.latLngBounds(nw, se), { pane: 'contourFill', interactive: false, className: 'con-surface' }).addTo(contourLayer);
  }
  if (filled) {
    // Soft edges: three nested areas drawn over each other, so the color fades toward the edge.
    const levels = conEdge === 'soft' ? [[1, 0.42], [0.7, 0.42], [0.45, 0.42]] : [[1, 1]];
    for (const [f, op] of levels) {
      const lim = f * maskPx, grid = new Float64Array(W * H);
      for (let i = 0; i < W * H; i++) grid[i] = inside[i] && dmin[i] <= lim ? ext[i] : -1;
      for (const band of d3.contours().size([W, H]).thresholds(breaks)(Array.from(grid))) {
        if (!band.coordinates.length) continue;
        const gj = { type: 'MultiPolygon', coordinates: band.coordinates.map(poly => poly.map(ring => ring.map(pt => { const ll = toLL(pt); return [ll.lng, ll.lat]; }))) };
        L.geoJSON(gj, { pane: 'contourFill', interactive: false,
          style: { stroke: false, fill: true, fillColor: rainClass(band.value).bg, fillOpacity: op } }).addTo(contourLayer);
      }
    }
  }
  const labels = [];
  if (!surface || conSurfLines) for (const band of d3.contours().size([W, H]).thresholds(breaks)(Array.from(ext))) {
    const lines = [];
    for (const poly of band.coordinates) for (const ring of poly) {
      let cur = [];
      for (const pt of ring) {
        if (isIn(pt[0], pt[1])) cur.push(toLL(pt));
        else { if (cur.length > 1) lines.push(cur); cur = []; }
      }
      if (cur.length > 1) lines.push(cur);
    }
    if (!lines.length) continue;
    L.polyline(lines, { pane: 'contourLine', interactive: false,
      ...(filled || surface ? { color: 'rgba(15,23,42,.45)', weight: 0.9 } : { color: rainClass(band.value).bg, weight: 2.2, opacity: 0.95 }) }).addTo(contourLayer);
    if (conLabels) for (const ln of lines) if (ln.length >= 14) labels.push([ln.length, ln[Math.floor(ln.length / 2)], band.value]);
  }
  if (conLabels) {
    // longest lines first, and no two labels closer than 70 px
    labels.sort((a, b) => b[0] - a[0]);
    const placed = [];
    for (const [, ll, v] of labels) {
      const q = leafletMap.latLngToContainerPoint(ll);
      if (q.x < 10 || q.y < 10 || q.x > size.x - 10 || q.y > size.y - 10) continue;
      if (placed.some(p => Math.hypot(p.x - q.x, p.y - q.y) < 70)) continue;
      placed.push(q);
      L.marker(ll, { pane: 'contourLine', interactive: false, keyboard: false,
        icon: L.divIcon({ className: '', html: `<span class="con-label">${v.toFixed(2)}</span>`, iconSize: [36, 14], iconAnchor: [18, 7] }) }).addTo(contourLayer);
      if (placed.length >= 60) break;
    }
  }
  contourLayer.addTo(leafletMap);
  // credit the terrain source only while Elevation is in use
  const terr = 'Terrain: AWS Terrain Tiles';
  if ((method === 'elev') !== terrCredited) {
    terrCredited = method === 'elev';
    if (terrCredited) leafletMap.attributionControl.addAttribution(terr); else leafletMap.attributionControl.removeAttribution(terr);
  }
  updateConNote();
}

function createMarkerLayer() {
  if (markerLayer) leafletMap.removeLayer(markerLayer);
  markerLayer = clusteringEnabled
    ? L.markerClusterGroup({
        maxClusterRadius: 40, disableClusteringAtZoom: 13, spiderfyOnMaxZoom: true, showCoverageOnHover: false, chunkedLoading: true,
        iconCreateFunction: cluster => {
          const vals = cluster.getAllChildMarkers().map(m => m.options.rain).filter(v => v != null);
          const med = median(vals) ?? 0, c = rainClass(med);
          return L.divIcon({
            html: `<div style="width:30px;height:30px;border-radius:50%;background:${c.bg};color:${c.fg};font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(0,0,0,.2);line-height:1.05"><span>${med.toFixed(2)}</span><span style="font-size:8px;font-weight:600;opacity:.85">n=${vals.length}</span></div>`,
            className: '', iconSize: [30, 30], iconAnchor: [15, 15],
          });
        },
      })
    : L.layerGroup();
  markerLayer.addTo(leafletMap);
}

let pinsMode = 'none';   // what the pins on the map were drawn for: 'full', 'vb' (playback: near the screen) or 'none'
function render() {
  updateScale();
  drawRings();
  markerLayer.clearLayers();
  for (const k in markersById) delete markersById[k];
  if (pinsHidden) leafletMap.removeLayer(markerLayer); else if (!leafletMap.hasLayer(markerLayer)) markerLayer.addTo(leafletMap);
  const vb = play && play.playing ? leafletMap.getBounds().pad(0.25) : null;   // while playing, pins near the screen only (faster frames)
  const list = pinsHidden ? [] : stations.filter(s => visible(s) && (!vb || vb.contains([s.lat, s.lon]))).sort((a, b) => a.p - b.p); // wettest on top
  const markers = [];
  for (const s of list) {
    const c = rainClass(s.p);
    const cls = `pin${s.suspect ? ' suspect' : ''}${s.src === 'O' ? ' official' : s.src === 'S' ? ' snotel' : ''}${pinStyle === 'dot' ? ' dot' : ''}`;
    const style = s.suspect ? '' : `background:${c.bg};color:${c.fg}`;
    const icon = pinStyle === 'dot'
      ? L.divIcon({ className: '', html: `<div class="${cls}" style="${style}"></div>`, iconSize: [12, 12], iconAnchor: [6, 6] })
      : L.divIcon({ className: '', html: `<div class="${cls}" style="${style}">${fmtV(s.p)}</div>`, iconSize: [34, 18], iconAnchor: [17, 9] });
    const m = L.marker([s.lat, s.lon], { icon, rain: s.suspect ? null : s.p, riseOnHover: true, station: s, pinCls: cls });
    m.bindPopup(() => buildPopup(s), { maxWidth: IS_PHONE ? 260 : 300, autoPanPaddingTopLeft: [10, IS_PHONE ? 70 : 10] });
    if (!IS_PHONE) m.bindTooltip(() => `${s.name} · ${fmtV(s.p)} ${METRICS[metric].unit}`, { direction: 'top', offset: [0, -10] });
    markers.push(m);
    markersById[s.id] = m;
  }
  if (markerLayer.addLayers) markerLayer.addLayers(markers); else markers.forEach(m => markerLayer.addLayer(m));
  pinsMode = pinsHidden ? 'none' : vb ? 'vb' : 'full';
  updateStats();
  syncSelPanel();
  drawContours();
}

function buildPopup(s) {
  const el = document.createElement('div');
  el.className = 'st-popup';
  const netLabel = s.src === 'A' ? 'Ambient Weather Network' : s.net;
  const links = [];
  if (s.snotel) links.push(`<a href="https://wcc.sc.egov.usda.gov/nwcc/site?sitenum=${s.snotel}" target="_blank" rel="noopener">SNOTEL site page (NRCS) →</a>`);
  if (s.iem) links.push(`<a href="https://mesonet.agron.iastate.edu/sites/site.php?station=${s.iem.id}&network=${s.iem.net}" target="_blank" rel="noopener">Station page (IEM) →</a>`);
  if (s.slug) links.push(`<a href="https://ambientweather.net/dashboard/${s.slug}" target="_blank" rel="noopener">Ambient dashboard →</a>`);
  el.innerHTML = `
    <h3></h3>
    <div class="sub"></div>
    <div class="big">${fmtV(s.p)} <small>${metric === 'hist' && hist ? (play ? play.label : hist.label) : METRICS[metric].title.replace(/ \(.*\)$/, '').replace(/^Rain /, '').toLowerCase()} (${METRICS[metric].unit})</small></div>
    <div class="vals">${Object.entries(METRICS).filter(([k2]) => s.v[k2] != null).map(([k2, m2]) =>
      `<div class="${k2 === metric ? 'on' : ''}"><b>${fmtV(s.v[k2])}</b><span>${m2.label}</span></div>`).join('')}</div>
    ${s.why ? `<div class="warn">${s.why}</div>` : ''}
    ${metric === 'hist' && s.hist ? `<div class="hist-days">${hist.mode === 'h' ? histHoursHtml(s.hist) : `${s.hist.have < s.hist.need ? `<div class="hist-gap">Readings on ${s.hist.have} of ${s.hist.need} days.</div>` : ''}${s.hist.days.slice(-31).map(([d, v]) => `<div class="row"><span>${fmtDay(d)}</span><span>${fmtV(v)} in</span></div>`).join('')}${s.hist.days.length > 31 ? `<div class="hist-gap">Last 31 days shown.</div>` : ''}`}</div>` : ''}
    <div class="row"><span>${metric === 'hist' ? 'Live reading as of' : 'As of'}</span><span>${s.time}</span></div>
    <div class="row"><span>From ${CENTER.name}</span><span>${s.dist.toFixed(1)} mi ${s.dist < 0.05 ? '' : s.dir}</span></div>
    ${s.elev ? `<div class="row"><span>Elevation</span><span>${s.elev.toLocaleString()} ft</span></div>` : ''}
    <div class="row"><span>Lat, Lon</span><span>${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}</span></div>
    ${links.length ? `<div style="margin-top:6px;display:flex;flex-direction:column;gap:2px">${links.join('')}</div>` : ''}`;
  el.querySelector('h3').textContent = s.name;
  el.querySelector('.sub').textContent = [netLabel, s.area].filter(Boolean).join(' · ');
  return el;
}

// ── Info panel ───────────────────────────────────────────────────────────────
const IS_PHONE = window.matchMedia('(max-width:700px)').matches;

function makeCollapsible(el, startCollapsed) {
  if (startCollapsed) el.classList.add('collapsed');
  el.querySelector('.panel-head').addEventListener('click', () => el.classList.toggle('collapsed'));
}

function addInfoPanel() {
  const c = L.control({ position: 'topleft' });
  c.onAdd = () => {
    const el = L.DomUtil.create('div', 'info-panel');
    el.id = 'info-panel';
    el.innerHTML = `
      <div class="app-name">4 Corners Precip Map <span id="app-ver"></span></div>
      <button class="panel-head" type="button"><h2 id="info-title">Rain Today</h2><span class="chev">▾</span></button>
      <div class="panel-body">
        <div class="asof" id="asof"></div>
        <div class="stat"><span>Gauges shown</span><span class="val" id="st-n"></span></div>
        <div class="stat"><span>Range</span><span class="val" id="st-rng"></span></div>
        <div class="stat"><span>Errors flagged</span><span class="val" id="st-sus"></span></div>
        <div class="refresh-row"><button class="panel-btn" id="refresh-btn" title="Back to the opening view and default settings, with fresh live data">↺ Reset</button><button class="info-btn" id="status-btn" type="button" aria-expanded="false" aria-controls="refresh-msg" title="About the data shown">i</button></div>
        <div class="refresh-msg" id="refresh-msg">Loading…</div>
      </div>`;
    L.DomEvent.disableClickPropagation(el);
    L.DomEvent.disableScrollPropagation(el);
    // Reset: reload without any period in the address, which is the opening view with every setting at its default and fresh live data
    el.querySelector('#refresh-btn').addEventListener('click', () => location.replace(location.pathname));
    // the status line shows while something is loading (its messages end in …) or on an error; otherwise behind the i button
    const msg = el.querySelector('#refresh-msg'), sb = el.querySelector('#status-btn');
    let statusOpen = false;
    const showMsg = () => msg.classList.toggle('show', statusOpen || msg.classList.contains('err') || /…\s*$/.test(msg.textContent));
    sb.addEventListener('click', () => { statusOpen = !statusOpen; sb.classList.toggle('active', statusOpen); sb.setAttribute('aria-expanded', String(statusOpen)); showMsg(); });
    new MutationObserver(showMsg).observe(msg, { childList: true, characterData: true, subtree: true });
    showMsg();
    el.querySelector('#app-ver').textContent = 'v' + APP_VERSION;
    makeCollapsible(el, IS_PHONE);
    return el;
  };
  c.addTo(leafletMap);
}

function updateStats() {
  const vis = stations.filter(s => visible(s));
  const good = vis.filter(s => !s.suspect).map(s => s.p);
  const inRadius = stations.filter(s => s.dist <= radius);
  document.getElementById('asof').textContent = dataTime;
  document.getElementById('st-n').textContent = vis.length;
  const U = METRICS[metric].unit;
  document.getElementById('info-title').textContent = metric === 'day' ? 'Rain Today' : metric === 'hist' && hist ? `Rain: ${play ? play.label : hist.label}` : `Rain: ${METRICS[metric].label}`;
  document.getElementById('st-rng').textContent = good.length ? `${fmtV(Math.min(...good))} – ${fmtV(Math.max(...good))} ${U}` : '—';
  document.getElementById('st-sus').textContent = `${inRadius.filter(s => s.suspect).length}${suspectFilter === 'exclude' ? ' (hidden)' : ''}`;
}

const fmtTime = ms => new Date(ms).toLocaleTimeString('en-US', { timeZone: 'America/Denver', hour: 'numeric', minute: '2-digit' });
const titleCase = s => s.toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase()).replace(/\bRaws\b/g, 'RAWS').replace(/\bAp\b/g, 'Airport').replace(/\bCo\b/g, 'CO').replace(/\bNm\b/g, 'NM').replace(/\bUt\b/g, 'UT').replace(/\b(N|S|E|W|Ne|Nw|Se|Sw|Nne|Nnw|Sse|Ssw|Ene|Ese|Wnw|Wsw)\b/g, d => d.toUpperCase());

// ── History (test) ──────────────────────────────────────────────────────────
// Past rain for personal stations, from the same public Ambient feed the
// station dashboards use: lightning.ambientweather.net/device-data, asked per
// station with its device address and its public dashboard address. Each day's
// rain is the end-of-day value of the station's daily rain counter (it resets at
// the station's local midnight); a period's total is the sum of its days.
// Official gauges and SNOTEL stay live-only for now.
let hist = null;                 // { from:'YYYY-MM-DD', to:'YYYY-MM-DD', key, days, label }
const histCache = new Map();     // key|mac -> { total, days:[[date, in]], have, need } | { err:true } | { busy:true }
const HIST_MAX_DAYS = 366;
const HIST_PAR = 40;             // requests at a time (the feed answers 40-odd at once about as fast as 6)
const HIST_MAX_STATIONS = 600;   // per pass, nearest the map center first
const isoDay = ms => new Date(ms).toISOString().slice(0, 10);
const addDays = (ds, n) => isoDay(Date.parse(ds + 'T12:00:00Z') + n * 86400e3);
const dayCount = (a, b) => Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 86400e3) + 1;
const todayDenver = () => { const p = dParts(Date.now()); return `${p.y}-${String(p.m).padStart(2, '0')}-${String(p.d).padStart(2, '0')}`; };
const fmtDay = ds => new Date(ds + 'T12:00:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' });
const tzFmt = new Map();
const localDay = (ms, tz) => {
  let f = tzFmt.get(tz);
  if (!f) { try { f = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }); } catch (e) { f = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Denver', year: 'numeric', month: '2-digit', day: '2-digit' }); } tzFmt.set(tz, f); }
  return f.format(ms);
};
function histWindows(h) {
  const [y, m, d] = h.from.split('-').map(Number), [y2, m2, d2] = addDays(h.to, 1).split('-').map(Number);
  const start = denverMidnight(y, m, d) - 2 * 3600e3, end = Math.min(Date.now(), denverMidnight(y2, m2, d2) + 2 * 3600e3);
  // 5-minute readings for one or two days, hourly for longer periods (the feed returns at most 2,000 per request)
  if (end - start <= 2.25 * 86400e3) return [{ start, end, res: 5 }];
  const out = [];
  for (let s = start; s < end; s += 80 * 86400e3) out.push({ start: s, end: Math.min(end, s + 80 * 86400e3), res: 60 });
  return out;
}
async function fetchHist(st, h) {
  const k = h.key + '|' + st.mac;
  histCache.set(k, { busy: true });
  const dayMax = new Map();
  try {
    for (const w of histWindows(h)) {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
      const r = await fetch('https://lightning.ambientweather.net/device-data?' + new URLSearchParams({
        macAddress: st.mac, dataKey: st.key, start: Math.round(w.start), end: Math.round(w.end), limit: 2000, res: w.res }), { signal: ctl.signal });
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json(), arr = Array.isArray(j) ? j : (j.data || []);
      for (const x of arr) {
        if (x.dailyrainin == null || x.dateutc == null) continue;
        const ds = localDay(x.dateutc, st.tz || 'America/Denver');
        if (ds < h.from || ds > h.to) continue;
        const v = +x.dailyrainin;
        if (!(dayMax.get(ds) >= v)) dayMax.set(ds, v);
      }
    }
    const days = [...dayMax.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1);
    const need = dayCount(h.from, h.to);
    histCache.set(k, days.length ? { total: +days.reduce((a, [, v]) => a + v, 0).toFixed(2), days, have: days.length, need } : { none: true });
  } catch (e) { histCache.set(k, { err: true }); }
}

  const b = leafletMap.getBounds().pad(0.05), ctr = leafletMap.getCenter();

// Ambient public network ----------------------------------------------------
const cells = new Map();        // "i,j" -> { t: last load time, busy }
const ambient = new Map();      // device id -> station
let official = [];

const cellInRange = (i, j) => {  // nearest point of the cell to the center is within MAX_RADIUS
  const lat = Math.min(Math.max(DATA_CENTER.lat, i * CELL_LAT), (i + 1) * CELL_LAT);
  const lon = Math.min(Math.max(DATA_CENTER.lon, j * CELL_LON), (j + 1) * CELL_LON);
  return miles(DATA_CENTER.lat, DATA_CENTER.lon, lat, lon) <= MAX_RADIUS;
};

async function fetchBox(w, s, e, n, depth, seen) {
  const q = new URLSearchParams({ '$publicBox[0][0]': w, '$publicBox[0][1]': s, '$publicBox[1][0]': e, '$publicBox[1][1]': n, '$limit': 100 });
  const r = await fetch('https://lightning.ambientweather.net/devices?' + q);
  if (!r.ok) throw new Error('Ambient HTTP ' + r.status);
  const arr = (await r.json()).data || [];
  // The API returns at most 100 devices per box, so split any full box into quarters.
  if (arr.length >= 100 && depth < 6) {
    const mx = (w + e) / 2, my = (s + n) / 2;
    await Promise.all([fetchBox(w, s, mx, my, depth + 1, seen), fetchBox(mx, s, e, my, depth + 1, seen),
                       fetchBox(w, my, mx, n, depth + 1, seen), fetchBox(mx, my, e, n, depth + 1, seen)]);
  } else arr.forEach(x => seen.set(x._id, x));
}

async function loadCell(key, sample) {
  const [i, j] = key.split(',').map(Number);
  const c = cells.get(key) || { t: 0 };
  c.busy = true; cells.set(key, c);
  try {
    const seen = new Map(), now = Date.now();
    await fetchBox(j * CELL_LON, i * CELL_LAT, (j + 1) * CELL_LON, (i + 1) * CELL_LAT, sample ? 99 : 0, seen);
    for (const [id, st] of ambient) if (st.cell === key) ambient.delete(id);
    for (const x of seen.values()) {
      const co = x.info?.coords?.geo?.coordinates, d = x.lastData || {};
      if (!co || d.dailyrainin == null || !(d.dateutc >= now - 3 * 3600e3)) continue;
      const lat = co[1], lon = co[0];
      if (miles(DATA_CENTER.lat, DATA_CENTER.lon, lat, lon) > MAX_RADIUS) continue;
      ambient.set(x._id, { src: 'A', net: 'Ambient', cell: key,
        name: ((x.public && x.public.name) || x.info.name || 'Ambient station').trim(),
        area: (x.info.coords.location || '').trim(), lat, lon,
        v: Object.fromEntries(Object.entries(METRICS).map(([k, m]) => [k, d[m.amb] == null ? null : +(+d[m.amb]).toFixed(2)])),
        time: fmtTime(d.dateutc), slug: x.info?.slug || x.public?.slug, mac: x.macAddress, key: x.info?.slug, tz: x.tz?.name });
    }
    c.t = now; c.err = false; c.sample = !!sample;
  } catch (e) { c.err = true; }
  c.busy = false;
}

let cellRun = 0;
async function ensureCells(force) {
  const hint = document.getElementById('zoom-hint');
  const b = leafletMap.getBounds().pad(0.1);
  const i0 = Math.floor(b.getSouth() / CELL_LAT), i1 = Math.floor(b.getNorth() / CELL_LAT);
  const j0 = Math.floor(b.getWest() / CELL_LON), j1 = Math.floor(b.getEast() / CELL_LON);
  const inView = [];
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) if (cellInRange(i, j)) inView.push(hkey(i, j));
  // Zoomed far out, load a sample (up to 100 stations per cell); closer in, load every station.
  const sample = inView.length > MAX_CELLS;
  hint.style.display = sample ? 'block' : 'none';
  const now = Date.now();
  const need = inView.filter(k => {
    const c = cells.get(k);
    if (!c) return true;
    if (c.busy) return false;
    if (!sample && c.sample) return true;           // upgrade a sampled cell to full detail
    return force || c.err || now - c.t > CELL_TTL;
  });
  if (!need.length) return;
  const run = ++cellRun;
  const msg = document.getElementById('refresh-msg');
  msg.className = 'refresh-msg';
  let done = 0, failed = 0;
  // nearest cells first, eight at a time
  const ctr = leafletMap.getCenter();
  need.sort((a, z) => { const [ai, aj] = a.split(',').map(Number), [zi, zj] = z.split(',').map(Number);
    return Math.hypot(ai + .5 - ctr.lat / CELL_LAT, aj + .5 - ctr.lng / CELL_LON) - Math.hypot(zi + .5 - ctr.lat / CELL_LAT, zj + .5 - ctr.lng / CELL_LON); });
  for (let k = 0; k < need.length; k += 8) {
    msg.textContent = `${Math.round(100 * k / need.length)}%…`;
    await Promise.all(need.slice(k, k + 8).map(async key => { await loadCell(key, sample); done++; if (cells.get(key).err) failed++; }));
    if (k % 32 === 0 || k + 8 >= need.length) rebuild();
  }
  if (run !== cellRun) return;
  setStatus(failed ? `Some areas did not load (${failed} of ${need.length}). Use Refresh to try again.` : '', !!failed);
}

    if (near(hash, s0, 0.3).length) continue;   // same site in two networks
    const net = n.endsWith('_ASOS') ? 'NWS ASOS' : n === 'USCRN' ? 'NOAA USCRN' : isRaws ? 'RAWS' : 'Remote gauge';

        let prevPc = null;
        for (const o of rows) {
          const k = hourOf(o.t - 1800e3);   // a reading at :27 is mostly the hour before it
          let v = 0;
          if (usePP) { if (o.pp == null) continue; v = o.pp; }
          else { if (prevPc != null) { const d = o.pc - prevPc; v = d >= 0 && d < 2 ? d : 0; } prevPc = o.pc; }
          if (k < 0 || k >= nH) continue;
          if (v > 0.005) e.hours[k] += v;
          e.seen[k] = 1; if (o.t > e.last) e.last = o.t;
        }
        push(mk(x, net, 'RAWS', e));
      }
    } catch (e) { console.warn('IEM RAWS', net, e); }
  });
  // the same site in two networks: keep the first
  const kept = [], hash = new Map();
  for (const x of out) { if (near(hash, x, 0.3).length) continue; kept.push(x); const k = hkey(Math.floor(x.lat / HASH), Math.floor(x.lon / HASH)); (hash.get(k) || hash.set(k, []).get(k)).push(x); }
  return { list: kept, skipped: false };
}
function officialFor(h) {
  loadOfficialHist(h).then(({ list, skipped }) => {
    if (hist !== h) return;
    h.official = list; h.officialSkip = skipped; delete h.officialErr;
    if ('arch' in h) { rebuild(); if (!/…\s*$/.test(document.getElementById('refresh-msg').textContent)) histStatus(); }
  }).catch(e => {
    if (hist !== h) return;
    h.officialErr = true; console.warn('NWS/RAWS history', e);
    if (!h.officialRetried) { h.officialRetried = true; setTimeout(() => { if (hist === h && !h.official) officialFor(h); }, 20000); }
  });
}

// Combine, de-duplicate and redraw ------------------------------------------
function rebuild() {
  const amb = [];
  const hash = new Map();
  if (hist && hist.arch) {
    const live = new Map(); for (const s of ambient.values()) if (s.mac) live.set(s.mac, s);
    const t = hist.arch.tail, liveT = tailLive(hist), liveH = tailLiveHours(hist);
    for (const [mac, a] of hist.arch.sums) {
      const m = archStations[mac]; if (!m) continue;
      let total = a.total, days = a.days, have = a.have, need = a.need ?? hist.days;
      const L = live.get(mac);
      let todayLive = null;
      if (t) {
        const tc = histCache.get(t.key + '|' + mac);
        if (tc && tc.total != null) { total = +(total + tc.total).toFixed(2); days = days.concat(tc.days); have += tc.have; if (hist.mode === 'h') need += tc.need; }
        else if (liveT && L && L.v.day != null) { total = +(total + L.v.day).toFixed(2); days = days.concat([[t.to, L.v.day]]); have += 1; }
        else if (liveH && L && L.v.day != null) { total = +(total + L.v.day).toFixed(2); todayLive = L.v.day; }   // hours: the total is complete now; the hours of today follow
      }
      amb.push({ src: 'A', net: 'Ambient', name: L ? L.name : m[2], area: L ? L.area : '', lat: m[0], lon: m[1], slug: m[3], mac, key: m[3], tz: m[4],
        v: { ...(L ? L.v : {}), hist: total }, time: L ? L.time : 'not reporting now', hist: { total, days, have, need, todayLive } });
    }
  } else
  for (const s of ambient.values()) {
    // one owner sometimes registers the same station twice
    const twin = near(hash, s, 0.05).find(o => Math.abs(o.v.day - s.v.day) < 0.01);
    if (twin) { if (!twin.name.includes(s.name)) twin.name += ' / ' + s.name; continue; }
    const c = { ...s };
    if (hist) { const hc = histCache.get(hist.key + '|' + s.mac); c.v = { ...s.v, hist: hc && hc.total != null ? hc.total : null }; c.hist = hc && hc.total != null ? hc : null; }
    amb.push(c);
    const k = hkey(Math.floor(c.lat / HASH), Math.floor(c.lon / HASH));
    (hash.get(k) || hash.set(k, []).get(k)).push(c);
  }
  stations = [...amb, ...(hist ? (hist.official || []) : official), ...(hist ? (hist.snotel || []) : snotel)].filter(s => s.v[metric] != null).map((s, i) => ({ ...s, p: s.v[metric], id: i }));
  computeDerived();
  pinsMode = 'none';   // the pins on the map still point at the old station objects, so the next frame redraws them
  if (play) playApply(); else render();
}

let lastLoad = 0;
function setStatus(extra, isErr) {
  if (hist && !extra) return histStatus();
  const msg = document.getElementById('refresh-msg');
  const a = stations.filter(s => s.src === 'A').length, o = stations.filter(s => s.src === 'O').length, sn = stations.filter(s => s.src === 'S').length;
  msg.className = 'refresh-msg' + (isErr ? ' err' : '');
  const zoomedOut = document.getElementById('zoom-hint').style.display === 'block';
  msg.textContent = extra || `${a} personal, ${o} official and ${sn} SNOTEL gauges loaded, all live. ` +
    (zoomedOut ? 'Zoomed out, so personal stations are a sample; zoom in for all of them.' : 'Personal stations load for the area on screen.');
}

let loading = false;
async function loadData() {
  if (loading) return;
  loading = true;
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true; btn.textContent = 'Loading…';
  setStatus('Loading…');
  const now = Date.now();
  let offErr = false;
  try { await loadOfficial(); } catch (e) { offErr = true; }
  loadSnotel().then(() => { if (!loading) setStatus(); })
    .catch(() => setStatus('SNOTEL sites could not be loaded (no connection, or the browser blocked it).', true));
  dataTime = `${new Date(now).toLocaleDateString('en-US', { timeZone: 'America/Denver', month: 'long', day: 'numeric' })}, live as of ${fmtTime(now)}`;
  rebuild();
  await ensureCells(true);
  if (hist) await ensureHist();
  btn.disabled = false; btn.textContent = '↺ Reset';
  if (offErr) setStatus('Official gauges could not be loaded (no connection, or the browser blocked it). Showing the last values it had.', true);
  else if (!document.getElementById('refresh-msg').classList.contains('err')) setStatus();
  loading = false;
}

initMap();
</script>
